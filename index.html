<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Legajo Digital del Aspirante</title>
<meta name="theme-color" content="#7241bd" />
<meta name="description" content="Sistema integral de legajo digital de aspirantes — DCFyCCCO, Secretaría Académica" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Legajo Digital" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
<script>window.__XLSX_ESTILOS__ = true;</script>
<style>
/* ===== TEMA OSCURO (por defecto) ===== */
:root, [data-theme="dark"]{
  --bg:#0c1207; --bg2:#141d0d; --panel:#182210; --panel2:#22301a; --border:#33481f;
  --txt:#eef7e4; --txt-dim:#9db588;
  /* Acentos: verde lima predominante + naranja/coral */
  --acc:#8fd400;          /* verde lima (principal) */
  --acc2:#b6f500;         /* lima brillante */
  --lima:#8fd400;         /* alias lima */
  --lima2:#b6f500;
  --coral:#ff6b35;        /* naranja/coral (secundario) */
  --coral2:#ff8c42;
  --gold:#8fd400;         /* alias -> acento principal (compat) */
  --gold2:#b6f500;        /* alias -> acento claro (compat) */
  --gold-dim:#5f8f1a;     /* alias -> acento tenue (compat) */
  --green:#37d67a; --red:#ff5a52; --amber:#ffb020; --blue:#8fd400;
  --info:#7aa7ff; --info-rgb:122,167,255;   /* desafectados */
  --btn-txt:#16240a;      /* texto oscuro sobre botón lima */
  --shadow:0 8px 30px rgba(0,0,0,.55);
}
/* ===== TEMA CLARO ===== */
[data-theme="light"]{
  --bg:#f2f6ea; --bg2:#ffffff; --panel:#ffffff; --panel2:#f0f6e6; --border:#d5e3c2;
  --txt:#1c2912; --txt-dim:#5d7048;
  --acc:#6faf00; --acc2:#5a9500; --lima:#6faf00; --lima2:#7cc400;
  --coral:#ef5a1f; --coral2:#ff7433;
  --gold:#6faf00; --gold2:#5a9500; --gold-dim:#9dc471;
  --green:#1a9e57; --red:#e0362e; --amber:#c77b00; --blue:#6faf00;
  --info:#2f5fc0; --info-rgb:47,95,192;
  --btn-txt:#16240a;
  --shadow:0 8px 24px rgba(143,212,0,.15);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Barlow',sans-serif;background:var(--bg);color:var(--txt);-webkit-font-smoothing:antialiased;transition:background .3s,color .3s;}
#root{min-height:100vh}
h1,h2,h3,h4,.font-display{font-family:'Oswald',sans-serif;letter-spacing:.5px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--bg2)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:5px}
::-webkit-scrollbar-thumb:hover{background:var(--acc)}
.btn{font-family:'Barlow',sans-serif;font-weight:600;font-size:14px;padding:10px 16px;border-radius:10px;border:1px solid transparent;cursor:pointer;transition:.18s;display:inline-flex;align-items:center;gap:8px;}
.btn-gold{background:linear-gradient(135deg,var(--acc2),var(--acc));color:var(--btn-txt);border-color:transparent;box-shadow:0 3px 12px rgba(143,212,0,.35)}
.btn-gold:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn-lima{background:linear-gradient(135deg,var(--lima2),var(--lima));color:#16240a;border-color:transparent;box-shadow:0 3px 12px rgba(143,212,0,.3)}
.btn-lima:hover{filter:brightness(1.06);transform:translateY(-1px)}
.btn-coral{background:linear-gradient(135deg,var(--coral2),var(--coral));color:#fff;border-color:transparent;box-shadow:0 3px 12px rgba(255,107,53,.35)}
.btn-coral:hover{filter:brightness(1.06);transform:translateY(-1px)}
.btn-ghost{background:transparent;color:var(--txt);border-color:var(--border)}
.btn-ghost:hover{background:var(--panel2);border-color:var(--acc)}
.btn-red{background:rgba(255,90,82,.12);color:var(--red);border-color:rgba(255,90,82,.4)}
.btn-red:hover{background:rgba(255,90,82,.22)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.inp{width:100%;background:var(--bg2);border:1px solid var(--border);color:var(--txt);padding:10px 12px;border-radius:10px;font-family:'Barlow';font-size:14px;transition:.15s;}
.inp:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px rgba(143,212,0,.2)}
.lbl{display:block;font-size:12px;color:var(--txt-dim);margin-bottom:5px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow)}
.tag{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600}
.fade{animation:fade .4s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.spin{width:18px;height:18px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.shield{filter:drop-shadow(0 2px 10px rgba(143,212,0,.4))}
.subsec{font-family:'Oswald';color:var(--acc2);font-size:15px;margin:18px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--coral);text-transform:uppercase;letter-spacing:1px}
/* Pestañas modernas tipo "pill" con acento lima */
.tabbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tabpill{font-family:'Barlow';font-weight:600;font-size:13px;padding:9px 16px;border-radius:22px;border:1px solid var(--border);background:var(--panel);color:var(--txt-dim);cursor:pointer;transition:.18s;white-space:nowrap}
.tabpill:hover{border-color:var(--acc);color:var(--txt)}
.tabpill.active{background:linear-gradient(135deg,var(--acc2),var(--acc));color:#16240a;border-color:transparent;box-shadow:0 3px 12px rgba(143,212,0,.35)}
.iconbtn{width:38px;height:38px;border-radius:11px;border:1px solid var(--border);background:var(--panel);color:var(--txt);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.15s;position:relative;flex-shrink:0}
.iconbtn:hover{border-color:var(--acc);color:var(--acc2)}
.notif-dot{position:absolute;top:-3px;right:-3px;min-width:16px;height:16px;border-radius:9px;background:var(--coral);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}
.pop-anchor{position:relative}
.pop{position:absolute;top:46px;right:0;width:280px;max-height:360px;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;background:var(--panel);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);z-index:200;padding:8px}
.pop b,.pop div{overflow-wrap:anywhere;word-break:break-word}
.navscroll{display:flex;gap:6px;margin-top:10px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.navscroll::-webkit-scrollbar{display:none}
/* Escudo animado en el login */
@keyframes escudoIn{0%{opacity:0;transform:scale(.6)}100%{opacity:1;transform:scale(1)}}
@keyframes giro{0%{transform:rotateY(16deg)}50%{transform:rotateY(-16deg)}100%{transform:rotateY(16deg)}}
.escudo-anim{animation:escudoIn .8s ease-out both;filter:drop-shadow(0 4px 14px rgba(143,212,0,.35))}
.escudo-gira{animation:giro 7s ease-in-out .8s infinite;transform-style:preserve-3d}
/* Fondo animado moderno (blobs verde+coral en movimiento) */
.bg-anim{position:fixed;inset:0;z-index:-1;overflow:hidden;background:var(--bg)}
.bg-anim::before,.bg-anim::after{content:"";position:absolute;border-radius:50%;filter:blur(70px);opacity:.5}
.bg-anim::before{width:55vw;height:55vw;background:radial-gradient(circle,rgba(143,212,0,.5),transparent 70%);top:-10%;left:-10%;animation:blob1 18s ease-in-out infinite}
.bg-anim::after{width:50vw;height:50vw;background:radial-gradient(circle,rgba(255,107,53,.42),transparent 70%);bottom:-15%;right:-10%;animation:blob2 22s ease-in-out infinite}
@keyframes blob1{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(20vw,15vh) scale(1.25)}66%{transform:translate(8vw,30vh) scale(.9)}}
@keyframes blob2{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(-18vw,-12vh) scale(1.15)}66%{transform:translate(-6vw,-25vh) scale(.95)}}
/* Frase destacada */
.frase{font-style:italic;font-size:14px;color:var(--txt);background:linear-gradient(135deg,rgba(143,212,0,.12),rgba(255,107,53,.12));border-left:3px solid var(--coral);border-radius:8px;padding:12px 14px;margin:8px 0 22px;line-height:1.5}

/* ══════════ PALETAS INTERCAMBIABLES ══════════ */
[data-paleta="lima"]{--acc:#8fd400;--acc2:#b6f500;--lima:#8fd400;--lima2:#b6f500;--coral:#ff6b35;--coral2:#ff8c42;--gold:#8fd400;--gold2:#b6f500;--gold-dim:#a8c96a;--blue:#8fd400;--acc-rgb:143,212,0;--coral-rgb:255,107,53}
[data-paleta="cobre"]{--acc:#e0873a;--acc2:#ffb26b;--lima:#e0873a;--lima2:#ffb26b;--coral:#49b8d4;--coral2:#79d4e8;--gold:#e0873a;--gold2:#ffb26b;--gold-dim:#d3a582;--blue:#49b8d4;--acc-rgb:224,135,58;--coral-rgb:73,184,212}
[data-paleta="oceano"]{--acc:#2fb6d9;--acc2:#79e2f7;--lima:#2fb6d9;--lima2:#79e2f7;--coral:#ff8a5b;--coral2:#ffab86;--gold:#2fb6d9;--gold2:#79e2f7;--gold-dim:#8fc9d8;--blue:#2fb6d9;--acc-rgb:47,182,217;--coral-rgb:255,138,91}
[data-paleta="violeta"]{--acc:#a678f0;--acc2:#cbaaff;--lima:#a678f0;--lima2:#cbaaff;--coral:#ffb03a;--coral2:#ffc86e;--gold:#a678f0;--gold2:#cbaaff;--gold-dim:#bda6dd;--blue:#a678f0;--acc-rgb:166,120,240;--coral-rgb:255,176,58}
[data-paleta="bosque"]{--acc:#3fbf7f;--acc2:#7ce8b0;--lima:#3fbf7f;--lima2:#7ce8b0;--coral:#ffa62b;--coral2:#ffc061;--gold:#3fbf7f;--gold2:#7ce8b0;--gold-dim:#93cfb1;--blue:#3fbf7f;--acc-rgb:63,191,127;--coral-rgb:255,166,43}
[data-theme="light"][data-paleta="lima"]{--acc:#5f9c00;--acc2:#4a7a00;--lima:#5f9c00;--lima2:#4a7a00;--coral:#e0551a;--coral2:#ff7433;--gold:#5f9c00;--gold2:#4a7a00;--gold-dim:#55702c;--acc-rgb:95,156,0;--coral-rgb:224,85,26}
[data-theme="light"][data-paleta="cobre"]{--acc:#b1631d;--acc2:#8c4c12;--lima:#b1631d;--lima2:#8c4c12;--coral:#1785a1;--coral2:#2ba0bd;--gold:#b1631d;--gold2:#8c4c12;--gold-dim:#7a5432;--acc-rgb:177,99,29;--coral-rgb:23,133,161}
[data-theme="light"][data-paleta="oceano"]{--acc:#1780a0;--acc2:#0f6076;--lima:#1780a0;--lima2:#0f6076;--coral:#d95d2a;--coral2:#f0763f;--gold:#1780a0;--gold2:#0f6076;--gold-dim:#315f70;--acc-rgb:23,128,160;--coral-rgb:217,93,42}
[data-theme="light"][data-paleta="violeta"]{--acc:#7241bd;--acc2:#57309a;--lima:#7241bd;--lima2:#57309a;--coral:#c47a00;--coral2:#e09400;--gold:#7241bd;--gold2:#57309a;--gold-dim:#5b4780;--acc-rgb:114,65,189;--coral-rgb:196,122,0}
[data-theme="light"][data-paleta="bosque"]{--acc:#1f8f5c;--acc2:#136b43;--lima:#1f8f5c;--lima2:#136b43;--coral:#c47100;--coral2:#e08800;--gold:#1f8f5c;--gold2:#136b43;--gold-dim:#2f5f47;--acc-rgb:31,143,92;--coral-rgb:196,113,0}

/* ══════════ TEMA CLARO: base neutra y fría, el color lo pone la paleta ══════════ */
[data-theme="light"]{--bg:#f4f6fb;--bg2:#ffffff;--panel:rgba(255,255,255,.86);--panel2:#f3f5fc;--border:#e3e6f0;--txt:#151824;--txt-dim:#5a6076;--btn-txt:#ffffff;--shadow:0 14px 34px rgba(35,30,70,.10)}

/* ══════════ FONDO AURORA (se tiñe con la paleta activa) ══════════ */
body{background:var(--bg);background-attachment:fixed}
body{background-image:radial-gradient(58vw 44vw at 6% -6%, rgba(var(--acc-rgb),.22), transparent 62%),radial-gradient(52vw 40vw at 98% 2%, rgba(var(--coral-rgb),.18), transparent 62%),radial-gradient(60vw 48vw at 52% 108%, rgba(var(--acc-rgb),.14), transparent 66%)}
.bg-anim{background:transparent}
.bg-anim::before{background:radial-gradient(circle,rgba(var(--acc-rgb),.5),transparent 70%)}
.bg-anim::after{background:radial-gradient(circle,rgba(var(--coral-rgb),.42),transparent 70%)}
[data-theme="light"] body{background-color:#f4f6fb;background-image:radial-gradient(62vw 48vw at 4% -8%, rgba(var(--acc-rgb),.30), transparent 60%),radial-gradient(56vw 42vw at 100% 0%, rgba(var(--coral-rgb),.24), transparent 60%),radial-gradient(52vw 44vw at 46% 112%, rgba(var(--acc-rgb),.20), transparent 64%),linear-gradient(180deg,#ffffff 0%,#f5f6fc 40%,#eef0f8 100%)}
/* trama de puntos finos: le da textura sin ensuciar */
[data-theme="light"] body::before{content:"";position:fixed;inset:0;z-index:-3;pointer-events:none;background-image:radial-gradient(circle at 1px 1px, rgba(30,30,60,.10) 1px, transparent 0);background-size:26px 26px;opacity:.55}
/* velo diagonal muy suave, tipo panel de vidrio */
[data-theme="light"] body::after{content:"";position:fixed;inset:0;z-index:-3;pointer-events:none;background:linear-gradient(112deg, rgba(255,255,255,0) 0 38%, rgba(255,255,255,.55) 38% 52%, rgba(255,255,255,0) 52% 100%)}
[data-theme="light"] .bg-anim::before,[data-theme="light"] .bg-anim::after{opacity:.22;filter:blur(90px)}

/* ══════════ VIDRIO ESMERILADO ══════════ */
.card{backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.topbar{background:var(--bg2);border-bottom:1px solid var(--border);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
[data-theme="light"] .topbar{background:rgba(255,255,255,.72);border-bottom:1px solid rgba(255,255,255,.9);box-shadow:0 1px 0 rgba(var(--acc-rgb),.35),0 10px 30px rgba(35,30,70,.07)}
[data-theme="light"] .card{background:rgba(255,255,255,.82);border-color:rgba(255,255,255,.95);box-shadow:0 14px 32px rgba(35,30,70,.10),0 1px 0 rgba(var(--acc-rgb),.18) inset;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
[data-theme="light"] .pop{background:rgba(255,255,255,.94);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
[data-theme="light"] .inp{background:rgba(255,255,255,.9);border-color:#dfe3ee;box-shadow:inset 0 1px 2px rgba(0,0,0,.04)}
[data-theme="light"] .tabpill,[data-theme="light"] .pill-sec,[data-theme="light"] .iconbtn{background:rgba(255,255,255,.78);border-color:rgba(30,30,70,.10)}
[data-theme="light"] ::-webkit-scrollbar-track{background:#eceff8}
[data-theme="light"] ::-webkit-scrollbar-thumb{background:#c9cfe0}
[data-theme="light"] .spin{border-color:rgba(0,0,0,.15);border-top-color:var(--acc)}

/* ══════════ CONTRASTE DE TEXTO (que nada quede ilegible al cambiar de modo) ══════════ */
.btn-lima,.btn-gold,.tabpill.active{color:#12190a}
[data-theme="light"] .btn-lima,[data-theme="light"] .btn-gold,[data-theme="light"] .btn-coral,[data-theme="light"] .tabpill.active,[data-theme="light"] .notif-dot{color:#fff}
.btn-gold,.btn-lima,.tabpill.active,.btn-coral{box-shadow:0 4px 14px rgba(0,0,0,.22)}
.tabpill.active{background:linear-gradient(135deg,var(--acc2),var(--acc))}
[data-theme="light"] .lbl{color:var(--txt-dim)}
[data-theme="light"] .subsec{color:var(--acc2)}
.subsec{border-bottom-color:var(--coral)}
[data-theme="light"] .btn-ghost{color:var(--txt);border-color:rgba(30,30,70,.16)}
[data-theme="light"] .menu-item{color:var(--txt)}

/* ══════════ PASTILLAS DE SECCIÓN ══════════ */
.pill-sec{font-family:'Barlow';font-weight:600;font-size:12px;padding:7px 13px;border-radius:20px;border:1px solid var(--border);background:var(--panel);color:var(--txt-dim);cursor:pointer;transition:.16s;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.pill-sec:hover{border-color:var(--acc);color:var(--txt)}
.pill-sec.on{background:rgba(var(--acc-rgb),.18);border-color:var(--acc);color:var(--txt)}
.pill-sec b{color:var(--acc2)}

/* ══════════ MENÚ DE CONFIGURACIÓN ══════════ */
.menu-item{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--border);padding:12px 6px;cursor:pointer;color:var(--txt);font-family:'Barlow';transition:.15s}
.menu-item:hover{background:var(--panel2)}
.menu-item:last-child{border-bottom:0}
.menu-emoji{font-size:20px;line-height:1.1;flex-shrink:0}
.menu-tit{font-family:'Oswald';font-size:15px;letter-spacing:.4px;color:var(--txt)}
.menu-sub{font-size:12px;color:var(--txt-dim);margin-top:2px;line-height:1.35}
.menu-tit.destacado{color:var(--coral2)}
[data-theme="light"] .menu-tit.destacado{color:var(--coral)}
.anillo-txt{font-family:'Oswald';fill:var(--txt)}

/* ══════════ CARTEL DE LA FRASE DEL DÍA ══════════ */
.frase-top{display:flex;gap:14px;align-items:center;padding:14px 18px;border-radius:18px;border:1px solid var(--border);background:var(--panel);background-image:linear-gradient(120deg, rgba(var(--acc-rgb),.16) 0%, rgba(var(--acc-rgb),0) 45%, rgba(var(--coral-rgb),.16) 100%);box-shadow:var(--shadow);position:relative;overflow:hidden;color:var(--txt)}
.frase-top::after{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:linear-gradient(180deg,var(--acc2),var(--coral))}
[data-theme="light"] .frase-top{background:rgba(255,255,255,.85);background-image:linear-gradient(120deg, rgba(var(--acc-rgb),.20) 0%, rgba(255,255,255,.2) 48%, rgba(var(--coral-rgb),.18) 100%);border-color:rgba(255,255,255,.95)}
.frase-icono{font-family:'Oswald';font-size:34px;line-height:.8;color:var(--acc2);opacity:.8;flex-shrink:0;margin-left:4px}
.frase-saludo{font-family:'Oswald';font-size:15px;letter-spacing:.6px;color:var(--acc2)}
.frase-texto{font-size:14.5px;font-style:italic;line-height:1.45;margin-top:2px;color:var(--txt)}
.frase-fecha{font-size:11.5px;color:var(--txt-dim);text-transform:capitalize;text-align:right;flex-shrink:0;max-width:150px;line-height:1.3}
@media (max-width:620px){.frase-fecha{display:none}.frase-top{padding:12px 14px;gap:10px}.frase-icono{font-size:26px}}

/* ══════════ ESCUDO ══════════ */
@keyframes giroRL{from{transform:rotateY(0deg)}to{transform:rotateY(-360deg)}}
.escudo-gira{animation:giroRL 9s linear .6s infinite;transform-style:preserve-3d}
.escudo-anim{filter:drop-shadow(0 4px 14px rgba(var(--acc-rgb),.45))}
.shield{filter:drop-shadow(0 2px 10px rgba(var(--acc-rgb),.4))}
.marca{text-align:center;line-height:1}
.ojo{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:transparent;border:0;cursor:pointer;font-size:16px;line-height:1;padding:6px;border-radius:8px;opacity:.7;transition:.15s}
.ojo:hover{opacity:1;background:var(--panel2)}
:root{--bordo:#8c1c3a}
[data-theme="light"]{--bordo:#7a0f2b}
.bordo{color:var(--bordo)}

/* ══════════ INGRESO QUE ENTRA COMPLETO EN CUALQUIER PANTALLA ══════════ */
.login-wrap{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:clamp(8px,2vh,20px);position:relative}
.login-card{width:100%;max-width:352px;text-align:center;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  padding:clamp(18px,3.4vh,34px) clamp(18px,4.5vw,28px);
  display:flex;flex-direction:column;justify-content:center;
  min-height:min(96dvh,700px);max-height:96dvh;overflow-y:auto}
.login-card>*{flex-shrink:0}
.login-escudo{width:clamp(38px,7.2vh,62px)}
.login-tit{font-size:clamp(19px,3.4vh,27px)}
.login-sub{font-size:clamp(9px,1.5vh,12.5px)}
.login-barra{height:2px;width:54px;border-radius:2px;margin:clamp(6px,1.4vh,12px) auto clamp(8px,1.6vh,16px);background:linear-gradient(90deg,var(--acc2),var(--coral))}
.login-frase{font-size:clamp(12px,1.85vh,14.5px);padding:clamp(8px,1.5vh,12px) 14px;margin:0 0 clamp(10px,1.8vh,18px);line-height:1.4}
.login-campo{margin-bottom:clamp(8px,1.8vh,16px)}
.login-campo .inp{padding:clamp(7px,1.4vh,10px) 12px}
.login-pie{margin-top:clamp(10px,2vh,20px);padding-top:clamp(8px,1.6vh,15px);border-top:1px solid var(--border);font-size:11px;color:var(--txt-dim);line-height:1.5}
.login-pie .pie-sep{margin:clamp(6px,1.2vh,12px) auto}
.login-pie .pie-nombres{font-size:clamp(11.5px,1.7vh,13.5px)}
@media (max-height:470px){.login-frase{display:none}.login-pie .pie-inst{margin-top:2px}}
@media (max-width:420px){.login-wrap{padding:0}.login-card{max-width:100%;min-height:100dvh;border-radius:0;border:0}}

/* ══════════ PIES ORDENADOS ══════════ */
.pie-marca{font-family:'Oswald';font-size:14px;letter-spacing:2.2px;background:linear-gradient(135deg,var(--acc2),var(--coral));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;display:inline-block}
.pie-inst{font-size:11.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--acc2);font-weight:600;margin-top:5px}
.pie-sep{height:2px;width:46px;margin:13px auto;border-radius:2px;background:linear-gradient(90deg,var(--acc2),var(--coral));opacity:.75}
.pie-rotulo{font-size:9.5px;letter-spacing:3px;text-transform:uppercase;color:var(--txt-dim)}
.pie-nombres{font-family:'Oswald';font-size:13.5px;letter-spacing:.6px;color:var(--txt);margin-top:4px;line-height:1.5}
.pie-amp{color:var(--coral);font-weight:400;margin:0 2px}
.pie-copy{font-size:10.5px;color:var(--txt-dim);margin-top:8px;letter-spacing:.5px}

/* ══════════ MODO CLARO: fondo con más cuerpo ══════════ */
[data-theme="light"]{--bg:#e6eaf4;--panel2:#eef1fa;--border:#d5dae8}
[data-theme="light"] body{background-color:#e6eaf4;background-image:radial-gradient(62vw 48vw at 4% -8%, rgba(var(--acc-rgb),.42), transparent 60%),radial-gradient(56vw 42vw at 100% 0%, rgba(var(--coral-rgb),.34), transparent 60%),radial-gradient(52vw 44vw at 46% 112%, rgba(var(--acc-rgb),.30), transparent 64%),linear-gradient(180deg,#f2f4fb 0%,#e6eaf4 45%,#dbe0ee 100%)}
[data-theme="light"] body::before{background-image:radial-gradient(circle at 1px 1px, rgba(30,30,70,.14) 1px, transparent 0);opacity:.7}
[data-theme="light"] body::after{background:linear-gradient(112deg, rgba(255,255,255,0) 0 38%, rgba(255,255,255,.40) 38% 52%, rgba(255,255,255,0) 52% 100%)}
[data-theme="light"] .bg-anim::before,[data-theme="light"] .bg-anim::after{opacity:.30;filter:blur(85px)}
[data-theme="light"] .card{background:rgba(255,255,255,.90);border-color:rgba(255,255,255,.98);box-shadow:0 16px 36px rgba(30,26,70,.14)}
[data-theme="light"] .topbar{background:rgba(255,255,255,.80)}
.frase{background:linear-gradient(135deg,rgba(var(--acc-rgb),.12),rgba(var(--coral-rgb),.12));border-left-color:var(--coral)}
.inp:focus{box-shadow:0 0 0 3px rgba(var(--acc-rgb),.22)}

/* ══════════ AJUSTES PARA CELULAR ══════════ */
@media (max-width:640px){
  /* El panel de la campanita y el de configuración se anclan al ancho del
     encabezado, así nunca se salen de la pantalla en el celular. */
  .pop-anchor{position:static}
  .pop{top:calc(100% + 6px);left:12px;right:12px;width:auto!important;max-width:none;max-height:min(68vh,440px)!important;border-radius:16px;padding:10px}
  .tabpill{font-size:12.5px;padding:8px 14px}
  .subsec{font-size:14px}
}
@media (max-width:430px){
  .top-escudo{width:26px!important}
  .marca-tit{font-size:13.5px!important;letter-spacing:2.2px!important;text-indent:2.2px!important}
  .marca-sub{font-size:8.5px!important;letter-spacing:3px!important;text-indent:3px!important}
  .top-user{max-width:92px!important}
  .top-user-nom{font-size:11.5px!important}
  .top-user-rol{font-size:9px!important}
  .iconbtn{width:34px;height:34px;border-radius:10px}
  .pop{left:8px;right:8px}
  .btn{font-size:13px;padding:9px 13px}
  .pie-marca{font-size:12.5px;letter-spacing:1.6px}
}
@media (max-width:360px){
  .top-user{display:none}
}
</style>

const fmtFecha = s => {
  if (!s) return "—";
  const d = new Date(s + (s.length <= 10 ? "T00:00:00" : ""));
  return d.toLocaleDateString("es-AR", {
    day: "2-digit",
    month: "2-digit",
    year: "numeric"
  });
};
const _withTimeout = (p, ms = 12000) => Promise.race([p, new Promise((_, r) => setTimeout(() => r(new Error("timeout")), ms))]);

// Hash de contraseña (SHA-256 + sal). Requiere https o file:// — en GitHub Pages funciona.
async function hashPass(txt) {
  const dato = SALT + (txt || "");
  try {
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(dato));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
  } catch (e) {
    let x = 5381;
    for (let i = 0; i < dato.length; i++) x = (x * 33 ^ dato.charCodeAt(i)) >>> 0;
    return "fb" + x.toString(16);
  }
}

// Las fotos se achican antes de subir: ocupan mucho menos y se ven igual
async function comprimirImagen(file) {
  if (!file || !/^image\//.test(file.type) || /gif|svg/.test(file.type)) return file;
  try {
    const bitmap = await createImageBitmap(file);
    const escala = Math.min(1, LADO_MAX_FOTO / Math.max(bitmap.width, bitmap.height));
    if (escala === 1 && file.size < 400 * 1024) return file;
    const lienzo = document.createElement("canvas");
    lienzo.width = Math.round(bitmap.width * escala);
    lienzo.height = Math.round(bitmap.height * escala);
    lienzo.getContext("2d").drawImage(bitmap, 0, 0, lienzo.width, lienzo.height);
    const blob = await new Promise(res => lienzo.toBlob(res, "image/jpeg", CALIDAD_FOTO));
    if (!blob || blob.size >= file.size) return file;
    return new File([blob], (file.name || "foto").replace(/\.[^.]+$/, "") + ".jpg", { type: "image/jpeg" });
  } catch (e) {
    return file;
  }
}

//  SESIÓN (Supabase Auth)

// ══════════════════════════════════════════════════════════════
// Cambia la contraseña de OTRA persona del equipo.
// La app no tiene la llave para hacerlo: sólo le pide el cambio a la base.
// La función lda_cambiar_clave (en Supabase) verifica que quien lo pide
// tenga rol admin antes de tocar nada. Devuelve "OK" o "ERROR: motivo".
async function cambiarClaveDe(usuario, nueva) {
  try {
    const { data, error } = await _withTimeout(sb.rpc("lda_cambiar_clave", {
      p_usuario: norm(usuario).trim(),
      p_nueva: nueva
    }), 20000);
    if (error) {
      if (/could not find the function|does not exist/i.test(error.message || ""))
        return "ERROR: falta instalar la función lda_cambiar_clave en Supabase";
      return "ERROR: " + error.message;
    }
    return data || "ERROR: la base no respondió";
  } catch (e) {
    return "ERROR: " + e.message;
  }
}

async function perfilDe(usuario) {
  const { data, error } = await _withTimeout(sb.from(TABLAS.usuarios).select("*").eq("usuario", norm(usuario).trim()).maybeSingle());
  if (error || !data) return null;
  return {
    id: data.id,
    grado: data.grado || "",
    nombre: data.nombre,
    usuario: data.usuario,
    rol: data.rol,
    secciones: data.secciones || []
  };
}
async function sesionActiva() {
  if (!sb) return null;
  try {
    const { data } = await sb.auth.getSession();
    const correo = data && data.session && data.session.user ? data.session.user.email : "";
    if (!correo) return null;
    return await perfilDe(correo.split("@")[0]);
  } catch (e) {
    return null;
  }
}
async function cerrarSesion() {
  try {
    if (sb) await sb.auth.signOut();
  } catch (e) {}
}

function legajoTexto(l) {
  const p = [l.apellido, l.nombre, l.sexo, l.asistencia, l.dni, l.cuil, l.legajoNro, l.seccion, l.credencial, l.lugarNac, l.localidad, l.telefono, l.email, l.grupoSang, l.obraSocial, l.observaciones, l.domicilioReal, l.domicilioLegal];
  const f = l.familia || {};
  p.push(f.conQuienVive, f.estadoCivil, f.conyugeNombre, f.observaciones);
  (l.hijos || []).forEach(h => p.push(h.nombre));
  if (l.padre) p.push(l.padre.nombre, l.padre.ocupacion);
  if (l.madre) p.push(l.madre.nombre, l.madre.ocupacion);
  (l.hermanos || []).forEach(h => p.push(h.nombre));
  (l.estudios || []).forEach(e => p.push(e.titulo, e.instituto));
  (l.empleos || []).forEach(e => p.push(e.oficio, e.especialidad, e.otros));
  const m = l.medico || {};
  ["cirugias", "patologias", "traumatologicos"].forEach(k => {
    const o = m[k] || {};
    p.push(o.tipo, o.motivo, o.observaciones);
  });
  if (m.alergico) p.push(m.alergico.causa);
  if (m.medicacion) p.push(m.medicacion.detalle);
  if (l.carnet) p.push(l.carnet.categoria, l.carnet.queManeja, l.carnet.municipio);
  (l.recargos || []).forEach(r => p.push(r.motivo, r.dispuestoPor));
  (l.sanciones || []).forEach(s => p.push(s.tipo, s.descripcion, s.dispuestoPor));
  (l.expedientes || []).forEach(e => p.push(e.nro, e.caratula, e.estado, e.detalle));
  (l.carpetas || []).forEach(c => {
    p.push(c.nombre);
    (c.archivos || []).forEach(a => p.push(a.nombre, a.tipo));
  });
  return norm(p.filter(Boolean).join(" "));
}

function hexApp(v, fb) {

    return fb;
  }

    acc: hexApp("--acc", "8FD400"),

    coral: hexApp("--coral", "FF6B35"),

    borde: "DCE7CB",

}

function hojaEstilizada(cols, filas) {

  for (let R = r.s.r; R <= r.e.r; R++) {
    for (let C = r.s.c; C <= r.e.c; C++) {
      const dir = XLSX.utils.encode_cell({ r: R, c: C });
      if (!ws[dir]) ws[dir] = { t: "s", v: "" };
      const cab = R === 0;
      ws[dir].s = {
        font: { name: "Calibri", sz: cab ? 11 : 10, bold: cab, color: { rgb: cab ? "FFFFFF" : P.texto } },
        fill: { patternType: "solid", fgColor: { rgb: cab ? P.fondoTitulo : R % 2 ? "FFFFFF" : P.zebra } },
        alignment: { vertical: "center", horizontal: cab ? "center" : "left", wrapText: !cab },
        border: { top: linea, bottom: linea, left: linea, right: linea }
      };
      if (cab) ws[dir].s.fill.fgColor = { rgb: P.acc };
      if (cab) ws[dir].s.font.color = { rgb: "16240A" };
    }
  }
  ws["!cols"] = cols.map((c, i) => ({
    wch: Math.min(42, Math.max(11, ...[String(c).length + 4, ...filas.slice(0, 200).map(f => String(f[i] === undefined || f[i] === null ? "" : f[i]).length + 2)]))
  }));
  ws["!rows"] = [{ hpt: 24 }];
  ws["!autofilter"] = { ref: ws["!ref"] };

}

const partirApellidoNombre = txt => {
  const limpio = (txt || "").toString().replace(/\s+/g, " ").trim();
  if (!limpio) return { apellido: "", nombre: "" };
  if (limpio.includes(",")) {
    const [a, ...resto] = limpio.split(",");
    return { apellido: a.trim(), nombre: resto.join(" ").replace(/\s+/g, " ").trim() };
  }
  const p = limpio.split(" ");
  if (p.length === 1) return { apellido: p[0], nombre: "" };
  // apellido doble: la 2da palabra no es nombre de pila y la 3ra sí lo es
  const corte = (p.length >= 3 && !NOMBRES_PILA.has(norm(p[1])) && NOMBRES_PILA.has(norm(p[2]))) ? 2 : 1;
  return { apellido: p.slice(0, corte).join(" "), nombre: p.slice(corte).join(" ") };
};
async function leerSeccionesDeExcel(file) {
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(new Uint8Array(buf), { type: "array" });
  const vistos = {};
  const filas = [];
  for (const nombreHoja of wb.SheetNames) {
    const aoa = XLSX.utils.sheet_to_json(wb.Sheets[nombreHoja], { header: 1, raw: false, defval: "" });
    let cab = -1, cDni = -1, cSec = -1, cApe = -1, cNom = -1, cJunto = -1;
    for (let i = 0; i < Math.min(aoa.length, 15); i++) {
      const fila = (aoa[i] || []).map(c => norm(c).trim());
      const dni = fila.findIndex(c => c.includes("dni") || c.includes("documento"));
      const sec = fila.findIndex(c => c.includes("seccion"));
      if (dni < 0 || sec < 0) continue;
      cab = i; cDni = dni; cSec = sec;
      cJunto = fila.findIndex(c => c.includes("apellido") && c.includes("nombre"));
      if (cJunto < 0) {
        cApe = fila.findIndex(c => c.includes("apellido"));
        cNom = fila.findIndex(c => c.includes("nombre"));
      }
      break;
    }
    if (cab < 0) continue;
    for (let i = cab + 1; i < aoa.length; i++) {
      const f = aoa[i] || [];
      const dni = (f[cDni] || "").toString().replace(/[^0-9]/g, "").trim();
      const seccion = seccionDeValor(f[cSec]);
      if (!dni || !seccion || vistos[dni]) continue;
      let apellido = "", nombre = "", completo = "";
      if (cJunto >= 0) {
        completo = (f[cJunto] || "").toString();
        const par = partirApellidoNombre(completo);
        apellido = par.apellido; nombre = par.nombre;
      } else {
        apellido = (cApe >= 0 ? f[cApe] || "" : "").toString().trim();
        nombre = (cNom >= 0 ? f[cNom] || "" : "").toString().trim();
        completo = `${apellido} ${nombre}`.trim();
      }
      vistos[dni] = true;
      filas.push({ dni, seccion, apellido, nombre, completo });
    }
  }
  return filas;
}

function kpisDe(arr) {
  const n = f => arr.filter(f).length;
  return {
    total: arr.length,
    fem: n(l => l.sexo === "Femenino"),
    masc: n(l => l.sexo === "Masculino"),
    sinSexo: n(l => !l.sexo),
    presentes: n(l => l.asistencia === "Presente"),
    ausentes: n(l => l.asistencia === "Ausente"),
    sinAsist: n(l => !l.asistencia),
    certificado: n(l => (l.certMedico || {}).tiene === "Sí"),
    carnet: n(l => l.carnet && l.carnet.posee),
    sancionados: n(l => (l.sanciones || []).length > 0),
    recargos: n(l => (l.recargos || []).length > 0)
  };
}
function filasResumen(legajos) {

function Anillo({ partes, total, tam }) {
  const R = 54, C = 2 * Math.PI * R;
  const t = Math.max(1, total);
  let acum = 0;
  const size = tam || 150;
  return h("svg", { viewBox: "0 0 140 140", style: { width: size, height: size, flexShrink: 0 } },
    h("circle", { cx: 70, cy: 70, r: R, fill: "none", stroke: "var(--bg2)", strokeWidth: 18 }),
    partes.filter(p => p.valor > 0).map((p, i) => {
      const largo = p.valor / t * C;
      const el = h("circle", {
        key: i, cx: 70, cy: 70, r: R, fill: "none", stroke: p.color, strokeWidth: 18,
        strokeDasharray: `${largo} ${C - largo}`, strokeDashoffset: -acum,
        transform: "rotate(-90 70 70)", strokeLinecap: "butt"
      });
      acum += largo;
      return el;
    }),
    h("text", { x: 70, y: 66, textAnchor: "middle", className: "anillo-txt", style: { fontSize: 26 } }, total),
    h("text", { x: 70, y: 86, textAnchor: "middle", style: { fontSize: 11, fill: "var(--txt-dim)" } }, "aspirantes"));
}

    if (ocupado) return;
    if (!sel) return avisar("Elegí un usuario", "err");
    if (!nueva || nueva.length < 6) return avisar("La contraseña necesita al menos 6 caracteres", "err");
    const quien = usuarios.find(u => u.id === sel);
    if (!quien) return avisar("No encontré ese usuario", "err");
    setOcupado(true);
    try {
      if (sb) {
        const r = await cambiarClaveDe(quien.usuario, nueva);
        if (r !== "OK") {
          avisar(r.replace(/^ERROR:\s*/, ""), "err");
          return;
        }
      }
      const hs = await hashPass(nueva);
      await onGuardar(usuarios.map(u => u.id === sel ? { ...u, hash: hs } : u));
      avisar(`Listo. Entregale la contraseña a ${quien.nombre} y pedile que la cambie.`, "ok");
      cerrar();
    } catch (e) {
      avisar("No se pudo cambiar: " + e.message, "err");
    } finally {
      setOcupado(false);
    }
  };
  return h("div", null,
    h("div", { style: { fontSize: 13, color: "var(--txt-dim)", lineHeight: 1.6, marginBottom: 14 } },
      "Le asignás una contraseña provisoria a otra persona del equipo, se la entregás y ella la cambia en su primer ingreso desde Cambiar mi contraseña. La contraseña vieja no se puede consultar: sólo reemplazar."),
    h("div", { style: { marginBottom: 12 } },
      h("label", { className: "lbl" }, "Usuario"),
      h("select", {
        className: "inp",
        value: sel,
        onChange: e => setSel(e.target.value)
      }, h("option", { value: "" }, "— elegir —"),
        usuarios.map(u => h("option", { key: u.id, value: u.id }, `${u.nombre} (${u.usuario}) · ${ROLES[u.rol] || u.rol}`)))),
    h(Campo, { l: "Nueva contraseña", val: nueva, set: setNueva, editable: true, full: true, type: "password" }),
    h("div", { style: { display: "flex", gap: 8, justifyContent: "flex-end", marginTop: 8 } },
      h("button", { className: "btn btn-ghost", onClick: cerrar }, "Cancelar"),
      h("button", { className: "btn btn-coral", disabled: ocupado, onClick: aplicar }, ocupado ? "Cambiando…" : "Restablecer")));
}

    if (!CONFIGURADO) {
      avisar("Todavía no está conectada la nube (Supabase). Cuando la conectemos, este botón sube los adjuntos y libera el equipo.", "err");
      return;
    }
    const archivos = lsGet(LS_FILES, {});
    const claves = Object.keys(archivos);
    if (!claves.length) return avisar("No hay adjuntos guardados en este dispositivo", "ok");
    let ok = 0;
    for (const ruta of claves) {
      try {
        const resp = await fetch(archivos[ruta]);
        const blob = await resp.blob();
        const { error } = await sb.storage.from(STORAGE_BUCKET).upload(ruta, blob, { upsert: true });
        if (!error) {
          delete archivos[ruta];
          ok++;
        }
      } catch (e) {}

    lsSet(LS_FILES, archivos);

          filas: [...accesos].reverse().map(a => [a.fecha || "", a.nombre || "", a.usuario || "", ROLES[a.rol] || a.rol || ""]),
          vacio: "Todavía no hay ingresos registrados."
        })));
  }
  if (sub === "recorrido") {
    return h("div", { className: "fade", style: cont }, volver,
      h("h2", { style: { fontSize: 22, color: "var(--acc2)", marginBottom: 4 } }, "Recorrido de Usuarios"),
      h("div", { style: { fontSize: 13, color: "var(--txt-dim)", marginBottom: 16 } }, "Cada pantalla abierta y cada guardado queda registrado."),
      h("div", { className: "card", style: { padding: 4 } },
        h(Tabla, {
          cols: ["Fecha y hora", "Usuario", "Acción", "Detalle"],
          filas: [...recorrido].reverse().slice(0, 300).map(r => [r.fecha || "", r.nombre || r.usuario || "", r.accion || "", r.detalle || ""]),
          vacio: "Todavía no hay movimientos registrados."
        })));
  }
  if (sub === "panel") {
    let usado = 0;
    try {
      for (const k in localStorage) if (Object.prototype.hasOwnProperty.call(localStorage, k)) usado += (localStorage.getItem(k) || "").length;
    } catch (e) {}
    const adjuntos = Object.keys(lsGet(LS_FILES, {})).length;
    const dato = (t, v, s2) => h("div", { className: "card", style: { padding: 16, background: "var(--panel2)" } },
      h("div", { style: { fontSize: 26, fontFamily: "'Oswald'", color: "var(--acc2)" } }, v),
      h("div", { style: { fontSize: 12, color: "var(--txt-dim)", textTransform: "uppercase", letterSpacing: .6, marginTop: 4 } }, t),
      s2 ? h("div", { style: { fontSize: 11, color: "var(--txt-dim)", marginTop: 2 } }, s2) : null);
    return h("div", { className: "fade", style: cont }, volver,
      h("h2", { style: { fontSize: 22, color: "var(--acc2)", marginBottom: 16 } }, "Panel de Administración"),
      h("div", { style: { display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(min(170px,100%),1fr))", gap: 12, marginBottom: 18 } },
        dato("Legajos totales", legajos.length, `${legajos.filter(l => !esInactivo(l)).length} activos`),
        dato("Usuarios del sistema", usuarios.length, "administradoras e instructores"),
        dato("Adjuntos en el equipo", adjuntos, CONFIGURADO ? "podés migrarlos a la nube" : "todavía sin nube"),
        dato("Espacio ocupado", (usado / 1024 / 1024).toFixed(2) + " MB", "de este dispositivo"),
        dato("Base de datos", CONFIGURADO ? "En la nube" : "Local", CONFIGURADO ? "Supabase conectado" : "Supabase sin configurar"),
        dato("Novedades", avisos.length, "en la campanita")),
      h("div", { className: "card", style: { padding: 20 } },
        h("h3", { style: { color: "var(--acc2)", fontSize: 17, marginBottom: 12 } }, "Mantenimiento"),
        h("div", { style: { display: "flex", gap: 10, flexWrap: "wrap" } },
          h("button", { className: "btn btn-ghost", onClick: () => descargarRespaldo(legajos, usuarios, accesos, recorrido) }, "💾 Descargar respaldo completo"),
          ASPIRANTES_SEMILLA.length ? h("button", { className: "btn btn-ghost", onClick: onCompletar }, "⤓ Cargar datos del listado oficial") : null,
          h("button", { className: "btn btn-ghost", onClick: () => exportarExcel(legajos) }, "📊 Exportar todo a Excel")),
        h("div", { style: { fontSize: 12, color: "var(--txt-dim)", marginTop: 12, lineHeight: 1.5 } },
          "El respaldo guarda todos los legajos en un archivo .json en tu equipo. Las contraseñas nunca se incluyen.")),
      onImportarSecciones ? h("div", { className: "card", style: { padding: 20, marginTop: 14 } },
        h("h3", { style: { color: "var(--acc2)", fontSize: 17, marginBottom: 6 } }, "📥 Repartir aspirantes por sección"),
        h("div", { style: { fontSize: 12.5, color: "var(--txt-dim)", marginBottom: 14, lineHeight: 1.55 } },
          "Subí el Excel del listado oficial (tiene que tener una columna de DNI y otra de sección). A cada aspirante ya cargado le asigno su sección buscándolo por DNI, y a los que todavía no están les creo el legajo con apellido, nombre, DNI y sección. Nada se pisa: el resto de los datos queda igual."),
        h("input", {
          ref: refExcel, type: "file", accept: ".xlsx,.xls,.xlsm", hidden: true,
          onChange: async e => {
            const file = e.target.files && e.target.files[0];
            e.target.value = "";
            if (!file) return;
            setImpCargando(true);
            setImpRes(null);
            const r = await onImportarSecciones(file, impListado);
            setImpCargando(false);
            if (r) setImpRes(r);
          }
        }),
        h("div", { style: { display: "flex", gap: 10, flexWrap: "wrap", alignItems: "center" } },
          h("button", {
            className: "btn btn-lima", disabled: impCargando,
            onClick: () => refExcel.current && refExcel.current.click()
          }, impCargando ? "Importando…" : "📥 Elegir el Excel del listado"),
          h("span", { style: { fontSize: 12.5, color: "var(--txt-dim)" } }, "Los que se creen quedan como:"),
          h("select", {
            className: "inp", style: { width: "auto", minWidth: 130 }, value: impListado,
            onChange: e => setImpListado(e.target.value)
          }, LISTADOS.map(x => h("option", { key: x, value: x }, x)))),
        impRes ? h("div", { style: { marginTop: 16, borderTop: "1px solid var(--border)", paddingTop: 14 } },
          h("div", { style: { display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 10 } },
            [["Filas leídas", impRes.total, "var(--acc2)"],
             ["Secciones asignadas", impRes.asignados, "var(--green)"],
             ["Legajos creados", impRes.creados.length, "var(--coral)"],
             ["Ya estaban", impRes.yaEstaban, "var(--txt-dim)"],
             ["Con error", impRes.errores, impRes.errores ? "var(--red)" : "var(--txt-dim)"]
            ].map(([t, v, c]) => h("span", {
              key: t, className: "tag",
              style: { background: "var(--bg2)", color: c, border: "1px solid var(--border)" }
            }, `${t}: ${v}`))),
          impRes.creados.length ? h("div", null,
            h("div", { style: { fontSize: 12.5, color: "var(--txt-dim)", marginBottom: 8, lineHeight: 1.5 } },
              "Estos legajos los creé yo separando apellido y nombre por la primera palabra. Si alguno tiene apellido doble, tocalo y corregilo:"),
            h("div", { style: { display: "flex", flexWrap: "wrap", gap: 6 } },
              impRes.creados.map(l => h("button", {
                key: l.id, className: "tag",
                style: { background: "var(--bg2)", color: "var(--txt)", border: "1px solid var(--border)", cursor: "pointer" },
                onClick: () => onAbrir(l)
              }, `${l.apellido}, ${l.nombre} · ${l.seccion}`)))) : null) : null) : null);
  }
  // Revisión de datos
  const dnis = {};
  legajos.forEach(l => {
    const d = (l.dni || "").trim();
    if (d) dnis[d] = (dnis[d] || 0) + 1;
  });
  const chequeos = [
    ["Sin DNI cargado", legajos.filter(l => !(l.dni || "").trim())],
    ["DNI repetido", legajos.filter(l => dnis[(l.dni || "").trim()] > 1)],
    ["Sin sexo cargado", legajos.filter(l => !l.sexo && !esInactivo(l))],
    ["Sin sección asignada", legajos.filter(l => !l.seccion && !esInactivo(l))],
    ["Sin teléfono", legajos.filter(l => !(l.telefono || "").trim() && !esInactivo(l))],
    ["Licencia vencida", legajos.filter(l => l.carnet && l.carnet.posee && diasHasta(l.carnet.vencimiento) !== null && diasHasta(l.carnet.vencimiento) < 0)],
    ["Certificado médico vencido", legajos.filter(l => (l.certMedico || {}).tiene === "Sí" && diasHasta((l.certMedico || {}).hasta) !== null && diasHasta((l.certMedico || {}).hasta) < 0)],
    ["Baja / desafectación sin motivo indicado", legajos.filter(l => esInactivo(l) && !(l.motivoEstado || "").trim())]
  ];
  const sinInstructor = SECCIONES.filter(sec => !aCargoDe(usuarios, sec).length);
  return h("div", { className: "fade", style: cont }, volver,
    h("h2", { style: { fontSize: 22, color: "var(--acc2)", marginBottom: 4 } }, "Revisión de datos"),
    h("div", { style: { fontSize: 13, color: "var(--txt-dim)", marginBottom: 16 } }, "Tocá cualquier nombre para abrir el legajo y completarlo."),
    h("div", {
      className: "card",
      style: { padding: 16, marginBottom: 12, borderLeft: `4px solid ${sinInstructor.length ? "var(--coral)" : "var(--green)"}` }
    }, h("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "center", gap: 10, flexWrap: "wrap" } },
      h("b", { style: { fontFamily: "'Oswald'", fontSize: 16, letterSpacing: .4 } }, "Secciones sin instructor a cargo"),
      h("span", { className: "tag", style: { background: sinInstructor.length ? "rgba(255,107,53,.15)" : "rgba(55,214,122,.15)", color: sinInstructor.length ? "var(--coral)" : "var(--green)" } }, sinInstructor.length ? sinInstructor.join(", ") : "todas asignadas")),
      h("div", { style: { fontSize: 12, color: "var(--txt-dim)", marginTop: 8 } }, "Se asignan desde Usuarios, al crear o editar cada instructor.")),
    chequeos.map(([titulo, arr]) => h("div", {
      key: titulo,
      className: "card",
      style: { padding: 16, marginBottom: 12, borderLeft: `4px solid ${arr.length ? "var(--coral)" : "var(--green)"}` }
    }, h("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "center", gap: 10 } },
      h("b", { style: { fontFamily: "'Oswald'", fontSize: 16, letterSpacing: .4 } }, titulo),
      h("span", { className: "tag", style: { background: arr.length ? "rgba(255,107,53,.15)" : "rgba(55,214,122,.15)", color: arr.length ? "var(--coral)" : "var(--green)" } }, arr.length ? arr.length + " para revisar" : "todo en orden")),
      arr.length ? h("div", { style: { display: "flex", flexWrap: "wrap", gap: 6, marginTop: 10 } },
        arr.slice(0, 40).map(l => h("button", {
          key: l.id,
          className: "tag",
          style: { background: "var(--bg2)", color: "var(--txt)", border: "1px solid var(--border)", cursor: "pointer" },
          onClick: () => onAbrir(l)
        }, `${l.apellido || "—"}${l.dni ? " · " + l.dni : ""}`)),
        arr.length > 40 ? h("span", { style: { fontSize: 12, color: "var(--txt-dim)", alignSelf: "center" } }, `+${arr.length - 40} más`) : null) : null)));
}

// ══════════════════════════════════════════════════════════════
//  APP
// ══════════════════════════════════════════════════════════════
function App() {
  const [user, setUser] = useState(null);
  const [data, setData] = useState({ legajos: [], usuarios: [] });
  const [cargando, setCargando] = useState(false);
  const [sel, setSel] = useState(null);
  const [q, setQ] = useState("");
  const [qDeb, setQDeb] = useState("");
  const [fEstado, setFEstado] = useState("");
  const [fListado, setFListado] = useState("");
  const [fSexo, setFSexo] = useState("");
  const [fAsist, setFAsist] = useState("");
  const [fSeccion, setFSeccion] = useState("");
  const [vista, setVista] = useState("legajos");
  const [pagina, setPagina] = useState(1);
  const [toastMsg, setToastMsg] = useState(null);
  const [tema, setTemaState] = useState(getTema());
  const [paletaPref, setPaletaPrefState] = useState(getPaletaPref());
  const [avisos, setAvisos] = useState([]);
  const [accesos, setAccesos] = useState([]);
  const [recorrido, setRecorrido] = useState([]);
  const [ultimaLectura, setUltimaLectura] = useState(() => lsGet("lda_leidos", ""));
  const [ocultarHasta, setOcultarHasta] = useState(() => lsGet("lda_ocultos", ""));
  const [confirmar, setConfirmar] = useState(null);
  const [refresco, setRefresco] = useState(0);
  const POR_PAGINA = 24;

  const toast = (msg, tipo) => {
    setToastMsg({ msg, tipo });
    setTimeout(() => setToastMsg(null), 3000);
  };
  useEffect(() => {
    setTema(getTema());
    aplicarPaleta();
    sesionActiva().then(p => {
      if (p) setUser(p);
    });
  }, []);
  const cambiarTema = t => {
    setTema(t);
    setTemaState(t);
  };
  const cambiarPaleta = v => {
    setPaletaPref(v);
    setPaletaPrefState(v);
    toast(v === "auto" ? "La paleta vuelve a cambiar sola cada 4 días" : "Paleta fija: " + (PALETAS.find(p => p.id === v) || {}).n, "ok");
  };
  useEffect(() => {
    const t = setTimeout(() => {
      setQDeb(q);
      setPagina(1);
    }, 250);
    return () => clearTimeout(t);
  }, [q]);
  useEffect(() => {
    setPagina(1);
  }, [vista, fEstado, fListado, fSexo, fAsist, fSeccion]);

  const traerBitacoras = useCallback(async () => {
    try {
      const [av, ac, re] = await Promise.all([DB.bitacora("avisos", 80), DB.bitacora("accesos", 300), DB.bitacora("recorrido", 500)]);
      setAvisos(av || []);
      setAccesos(ac || []);
      setRecorrido(re || []);
    } catch (e) {}
  }, []);

  const cargar = useCallback(async () => {
    setCargando(true);
    try {
      const d = await DB.getAll();
      setData({ legajos: d.legajos || [], usuarios: d.usuarios || [] });
      const vistas = lsGet("lda_alertas", []);
      const nuevas = alertasVencimiento(d.legajos || []).filter(a => !vistas.includes(a.id));
      if (nuevas.length) {
        lsSet("lda_alertas", [...vistas, ...nuevas.map(a => a.id)].slice(-400));
        for (const a of nuevas) await apilar("avisos", { usuario: "sistema", nombre: "Sistema", msg: "⏰ " + a.msg }, 80);
      }
    } catch (e) {
      toast("Error al cargar: " + e.message, "err");
    }
    await traerBitacoras();
    setCargando(false);
  }, [traerBitacoras]);

  useEffect(() => {
    if (!user) return;
    cargar();
    registrarAcceso(user).then(a => a && setAccesos(a));
    toast(`${emojiHora()} ${saludoHora()}, ${comoLlamar(user)}`, "ok");
  }, [user, cargar]);

  // Tiempo real: lo que carga otra persona aparece acá al instante
  useEffect(() => {
    if (!user || !sb) return;
    const canal = sb.channel("lda-vivo")
      .on("postgres_changes", { event: "*", schema: "public", table: TABLAS.legajos }, carga => {
        const fila = carga.new || carga.old;
        if (!fila) return;
        setData(d => {
          if (carga.eventType === "DELETE") return { ...d, legajos: d.legajos.filter(x => x.id !== fila.id) };
          const l = migrarLegajo(fila.data);
          if (!l) return d;
          const existe = d.legajos.some(x => x.id === l.id);
          return { ...d, legajos: existe ? d.legajos.map(x => x.id === l.id ? l : x) : [...d.legajos, l] };
        });
      })
      .on("postgres_changes", { event: "*", schema: "public", table: TABLAS.avisos }, () => {
        DB.bitacora("avisos", 80).then(a => a && setAvisos(a)).catch(() => {});
      })
      .on("postgres_changes", { event: "*", schema: "public", table: TABLAS.usuarios }, () => {
        DB.getAll().then(d => setData(prev => ({ ...prev, usuarios: d.usuarios }))).catch(() => {});
      })
      .subscribe();
    return () => {
      try {
        sb.removeChannel(canal);
      } catch (e) {}
    };
  }, [user]);

  // Red de seguridad: si el tiempo real se corta, refresca solo cada 45 segundos
  useEffect(() => {
    if (!user) return;
    const t = setInterval(traerBitacoras, 45000);
    return () => clearInterval(t);
  }, [user, traerBitacoras]);

  useEffect(() => {
    if (user) registrarPaso(user, "Abrió " + vista, "");
  }, [vista, user]);

  const notifs = useMemo(() => (avisos || []).map(a => ({
    id: a.id,
    msg: a.msg,
    hora: a.fecha,
    leida: !!ultimaLectura && a.ts <= ultimaLectura,
    archivada: !!ocultarHasta && a.ts <= ocultarHasta
  })), [avisos, ultimaLectura, ocultarHasta]);

  const marcarLeidas = () => {
    const t = new Date().toISOString();
    lsSet("lda_leidos", t);
    setUltimaLectura(t);
  };
  // "Limpiar" sólo despeja la campanita: los avisos quedan guardados en el historial
  const archivarAvisos = () => {
    const t = new Date().toISOString();
    lsSet("lda_ocultos", t);
    setOcultarHasta(t);
    lsSet("lda_leidos", t);
    setUltimaLectura(t);
  };

  const visibles = data.legajos;
  const enBajas = vista === "bajas";

  const filtrados = useMemo(() => {
    const nq = norm(qDeb);
    return visibles.filter(l => {
      if (enBajas !== esInactivo(l)) return false;
      if (fSeccion && (l.seccion || "Sin asignar") !== fSeccion) return false;
      if (fEstado && (l.estado || "Activo") !== fEstado) return false;
      if (fListado && (l.listado || "1er listado") !== fListado) return false;
      if (fSexo && (l.sexo || "") !== fSexo) return false;
      if (fAsist && (l.asistencia || "") !== fAsist) return false;
      if (nq && !legajoTexto(l).includes(nq)) return false;
      return true;
    }).sort((a, b) => (a.apellido || "").localeCompare(b.apellido || "", "es"));
  }, [visibles, qDeb, fEstado, fListado, fSexo, fAsist, fSeccion, enBajas]);

  const delGrupo = useMemo(() => visibles.filter(l => enBajas === esInactivo(l)), [visibles, enBajas]);
  const cuentaSeccion = sec => delGrupo.filter(l => (l.seccion || "Sin asignar") === sec).length;

  const totalPaginas = Math.max(1, Math.ceil(filtrados.length / POR_PAGINA));
  const pagActual = Math.min(pagina, totalPaginas);
  const enPantalla = filtrados.slice((pagActual - 1) * POR_PAGINA, pagActual * POR_PAGINA);

  const guardarUsuarios = async nu => {
    await DB.guardarUsuarios(nu);
    setData(d => ({ ...d, usuarios: nu }));
  };

  const guardarLegajo = async l => {
    const anterior = data.legajos.find(x => x.id === l.id);
    if (!esAdmin(user)) {
      const mias = user.secciones || [];
      if (!l.seccion || !mias.includes(l.seccion)) {
        toast(mias.length ? `Sólo podés cargar o editar legajos de ${mias.join(" y ")}.` : "No tenés secciones a cargo: no podés editar legajos.", "err");
        return;
      }
      if (anterior && anterior.seccion && !mias.includes(anterior.seccion)) {
        toast(`Ese legajo es de ${anterior.seccion} y no está a tu cargo.`, "err");
        return;
      }
    }
    const cambios = diffLegajo(anterior, l);
    const registro = {
      id: uid(),
      usuario: comoLlamar(user),
      fecha: new Date().toLocaleString("es-AR", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" }),
      accion: anterior ? "Modificación" : "Alta",
      cambios
    };
    if (!anterior || cambios.length) l = { ...l, historial: [...(l.historial || []), registro].slice(-200) };
    if (!anterior && !l.fechaAlta) l.fechaAlta = hoy();
    if (anterior && !esInactivo(anterior) && esInactivo(l)) {
      l.fechaEstado = l.fechaEstado || hoy();
      if (!l.fechaBaja) l.fechaBaja = hoy();
    }
    if (esInactivo(anterior || {}) && !esInactivo(l)) l.fechaBaja = "";
    await DB.guardarLegajo(l);
    const nuevos = anterior ? data.legajos.map(x => x.id === l.id ? l : x) : [...data.legajos, l];
    setData({ ...data, legajos: nuevos });
    setSel(l);
    const quien = `${l.apellido || "aspirante"}`;
    const av = await publicarAviso(user, `${comoLlamar(user)} ${anterior ? "actualizó" : "creó"} el legajo de ${quien}${l.seccion ? " · " + l.seccion : ""}`);
    if (av) setAvisos(av);
    registrarPaso(user, anterior ? "Guardó un legajo" : "Creó un legajo", quien).then(r => r && setRecorrido(r));
    if (anterior && !esInactivo(anterior) && esInactivo(l)) toast(`Pasó a "${l.estado}": ahora está en Bajas, Desistieron y Desafectados`, "ok");
  };

  const completarDesdeListado = async () => {
    if (!esAdmin(user)) {
      toast("Sólo las administradoras pueden completar datos del listado", "err");
      return;
    }
    const porDni = {};
    ASPIRANTES_SEMILLA.forEach(a => porDni[(a.dni || "").trim()] = a);
    const campos = ["sexo", "edad", "fechaNac", "telefono", "domicilioReal", "ciudad", "provincia"];
    let tocados = 0;
    const nuevos = [];
    for (const l of data.legajos) {
      const a = porDni[(l.dni || "").trim()];
      if (!a) {
        nuevos.push(l);
        continue;
      }
      const faltan = {};
      campos.forEach(k => {
        if (!(l[k] || "").toString().trim() && a[k]) faltan[k] = a[k];
      });
      if (!Object.keys(faltan).length) {
        nuevos.push(l);
        continue;
      }
      const act = {
        ...l, ...faltan,
        historial: [...(l.historial || []), {
          id: uid(), usuario: comoLlamar(user),
          fecha: new Date().toLocaleString("es-AR", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" }),
          accion: "Completado desde el listado oficial",
          cambios: Object.keys(faltan).map(k => `${k}: "${faltan[k]}"`)
        }].slice(-200)
      };
      await DB.guardarLegajo(act);
      nuevos.push(act);
      tocados++;
    }
    setData({ ...data, legajos: nuevos });
    toast(tocados ? `${tocados} legajo${tocados === 1 ? "" : "s"} completado${tocados === 1 ? "" : "s"} desde el listado` : "No había datos pendientes de completar", "ok");
    if (tocados) {
      const av = await publicarAviso(user, `${comoLlamar(user)} completó ${tocados} legajos desde el listado oficial`);
      if (av) setAvisos(av);
    }
  };

  // Importa el listado oficial (Excel) y reparte a cada aspirante en su sección
  const importarSecciones = async (file, listadoNuevos) => {

            dni: (l.dni || "").toString().trim() || f.dni,
            historial: [...(l.historial || []), {
