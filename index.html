        vacio: "Todavía no hay aspirantes en este listado. Si ya tenés la planilla oficial, importála desde Administración → Panel de Administración."
      })));
}

// ══════════════════════════════════════════════════════════════
//  PLANILLA DE ESTADÍSTICAS DCFyCCCO
//  Es la planilla que la Secretaría Académica manda todos los 10 de
//  cada mes. Se arma sola con lo que hay cargado en los legajos,
//  respeta el formato del modelo oficial y, una vez cerrado el mes,
//  queda guardada tal cual se envió: los meses viejos no se tocan.
// ══════════════════════════════════════════════════════════════
const COLS_DCF = ["N°", "APELLIDO Y NOMBRE", "DNI", "GÉNERO", "EDAD", "TELEFONO REAL", "EMAIL REAL",
  "LUGAR DE NACIMIENTO", "LOCALIDAD DONDE RESIDE ACTUALMENTE", "ESTADO CIVIL", "HIJOS", "OBRA SOCIAL",
  "APTITUD FÍSICA", "CONDICIONES MÉDICAS ESPECIALES", "NIVEL EDUCATIVO ALCANZADO", "CARNET DE CONDUCIR",
  "SITUACIÓN ACTUAL", "AMONESTACIONES", "MOTIVO DE AMONESTACIONES", "MOTIVO DE BAJA", "FECHA DE BAJA"];
// Los anchos son los del archivo modelo: la planilla tiene que llegar igual
const ANCHOS_DCF = [4.14, 24.29, 10, 8.57, 6.14, 14.43, 15.43, 25.57, 25.43, 13.71, 9.14, 9.14,
  9.14, 19.71, 24.57, 23.29, 9.14, 17.86, 9.14, 32.71, 11.43];

// Los bordes del modelo, columna por columna (m = grueso, t = fino, - = sin
// borde). Se copian tal cual para que la planilla llegue igual a la original.
const BORDES_DCF_TITULO = ["mtmm", "t-mm", "mtmm", "ttmm", "ttmm", "ttmm", "ttmm", "ttmm",
  "ttmm", "ttmm", "ttmm", "t-mm", "t-mm", "t-mm", "tmmm", "ttmm", "--mm", "--mm", "--mm", "--mm", "-mmm"];
const BORDES_DCF_ENCABEZADO = ["mtmm", "ttmm", "ttmm", "ttmm", "ttmm", "ttmm", "ttmm", "ttmm",
  "ttmm", "ttmm", "ttmm", "ttmm", "ttmm", "ttmm", "ttmm", "ttmm", "ttmm", "ttmm", "ttmm", "ttmm", "tmmm"];

const MESES_ES = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];
const claveMes = f => {
  const d = f || new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
};
const nombreMes = clave => {
  const p = String(clave || "").split("-");
  return `${MESES_ES[Number(p[1]) - 1] || ""} ${p[0] || ""}`.trim();
};
const tituloPlanilla = clave => `PLANILLA RECOPILACIÓN DE DATOS ALUMNOS ${nombreMes(clave).toUpperCase()}`;

const esSi = v => norm(v || "").trim() === "si";

// Cuántos hijos: primero la lista cargada, si no el número del formulario
function hijosDeLegajo(l) {
  const n = (l.hijos || []).length;
  if (n) return n;
  const c = ((l.familia || {}).cantidadHijos || "").toString().trim();
  if (/^\d+$/.test(c)) return Number(c);
  if (esSi(c)) return "Sí";
  return 0;
}

// Aptitud física: lo que se haya cargado en la ficha; si está vacío, lo que
// diga el examen preocupacional.
function aptitudDe(l) {
  if (l.aptitudFisica) return l.aptitudFisica;
  const p = l.preocupacional || {};
  if (p.apto) return p.apto;
  if (p.realizado) return "Preocupacional realizado";
  return "Sin cargar";
}

// Lo escrito en la ficha manda; si no hay nada, se arma juntando todo lo que
// esté informado en Antecedentes médicos y en Datos personales.
function condicionesDe(l) {
  if (l.condicionesMedicas) return l.condicionesMedicas;
  const m = l.medico || {}, out = [];
  const cir = m.cirugias || {}, pat = m.patologias || {}, tra = m.traumatologicos || {};
  const med = m.medicacion || {}, len = m.lentes || {}, ale = m.alergico || {};
  if (esSi(pat.tiene)) out.push("Patología: " + (pat.tipo || "sin detallar"));
  if (esSi(cir.tiene)) out.push("Cirugía: " + (cir.tipo || "sin detallar"));
  if (esSi(tra.tiene)) out.push("Traumatológico: " + (tra.motivo || "sin detallar"));
  if (esSi(ale.es)) out.push("Alergia: " + (ale.causa || "sin detallar"));
  if (esSi(len.usa)) out.push("Usa lentes" + (len.tipo ? ` (${len.tipo})` : ""));
  if (esSi(med.toma)) out.push("Medicación: " + (med.detalle || "sin detallar"));
  if (l.enfermedadInformar) out.push(l.enfermedadInformar);
  if (l.medicacionConsume) out.push("Consume: " + l.medicacionConsume);
  const cm = l.certMedico || {};
  if (esSi(cm.tiene)) out.push("Certificado médico" + (cm.motivo ? ": " + cm.motivo : "") + (cm.hasta ? ` (hasta ${fmtFecha(cm.hasta)})` : ""));
  return out.length ? out.join(" · ") : "Sin condiciones informadas";
}

// Nivel educativo: el título más alto de los que tenga cargados
const NIVELES_EST = [[/universi|licenciad|abogac|ingenier|profesorad|contador/, 5],
  [/terciar|superior|tecnicatura/, 4],
  [/secundar|polimodal|bachiller|perito|tecnic|comercial/, 3],
  [/primar/, 1]];
function nivelDe(l) {
  if (l.nivelEducativo) return l.nivelEducativo;
  const es = (l.estudios || []).filter(e => (e.titulo || "").trim() || (e.instituto || "").trim());
  if (!es.length) return "Sin cargar";
  let mejor = null, rango = -1;
  es.forEach(e => {
    const txt = norm(`${e.titulo || ""} ${e.instituto || ""}`);
    let r = 2;
    for (const par of NIVELES_EST) {
      if (par[0].test(txt)) {
        r = par[1];
        break;
      }
    }
    const anio = String(e.anioEgreso || "");
    if (r > rango || (r === rango && anio > String((mejor || {}).anioEgreso || ""))) {
      rango = r;
      mejor = e;
    }
  });
  if (!mejor) return "Sin cargar";
  return `${mejor.titulo || "Sin título cargado"}${mejor.anioEgreso ? " – " + mejor.anioEgreso : ""}${esSi(mejor.adeudaMaterias) ? " (adeuda materias)" : ""}`;
}

function carnetTexto(l) {
  const c = l.carnet || {};
  if (!c.posee) return "No";
  const p = ["Sí"];
  if (c.categoria) p.push("Cat. " + c.categoria);
  if (c.vencimiento) p.push("vence " + fmtFecha(c.vencimiento));
  return p.join(" – ");
}

// Amonestaciones: las que se cargan en Legajo operativo. Las que no tienen
// tipo se cuentan como amonestación; las sanciones van aparte en el motivo.
const amonestacionesDe = l => (l.sanciones || []).filter(s => !s.tipo || s.tipo === "Amonestación");
function motivoAmonestaciones(l) {
  const s = l.sanciones || [];
  if (!s.length) return "";
  return s.map(x => `${x.tipo || "Amonestación"}${x.fecha ? " " + fmtFecha(x.fecha) : ""}: ${x.descripcion || "sin detallar"}`).join(" · ");
}

const localidadResidencia = l => [l.localidad, l.provincia].filter(Boolean).join(", ");

function filaDCF(l, i) {
  const inactivo = esInactivo(l);
  return [
    i + 1,
    nombreFormal(l),
    l.dni || "",
    l.sexo || "",
    l.edad || "",
    l.telefono || "",
    l.email || "",
    l.lugarNac || "",
    localidadResidencia(l),
    (l.familia || {}).estadoCivil || "",
    hijosDeLegajo(l),
    l.obraSocial || "",
    aptitudDe(l),
    condicionesDe(l),
    nivelDe(l),
    carnetTexto(l),
    l.estado || "Activo",
    amonestacionesDe(l).length,
    motivoAmonestaciones(l),
    inactivo ? (l.motivoEstado || l.estado || "") : "",
    inactivo ? fmtFecha(fechaDeEstado(l, l.estado)) : ""
  ];
}

// Excel con el formato del modelo: título arriba, encabezados en negrita
// con los mismos anchos de columna y todo el cuadro con borde.
function exportarPlanillaDCF(clave, filas) {
  const aoa = [[tituloPlanilla(clave)].concat(new Array(COLS_DCF.length - 1).fill("")), COLS_DCF].concat(filas);
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  const r = XLSX.utils.decode_range(ws["!ref"]);
  const fina = { style: "thin", color: { rgb: "000000" } };
  const gruesa = { style: "medium", color: { rgb: "000000" } };
  for (let R = r.s.r; R <= r.e.r; R++) {
    for (let C = r.s.c; C <= r.e.c; C++) {
      const dir = XLSX.utils.encode_cell({ r: R, c: C });
      if (!ws[dir]) ws[dir] = { t: "s", v: "" };
      const lado = t => t === "m" ? gruesa : t === "t" ? fina : undefined;
      const bordeDe = mapa => ({
        left: lado(mapa[C][0]), right: lado(mapa[C][1]),
        top: lado(mapa[C][2]), bottom: lado(mapa[C][3])
      });
      if (R === 0) {
        ws[dir].s = {
          font: C === 0 ? { name: "Aptos Narrow", sz: 16, bold: true } : { name: "Calibri", sz: 11 },
          alignment: { horizontal: "centerContinuous", vertical: "center" },
          border: bordeDe(BORDES_DCF_TITULO)
        };
      } else if (R === 1) {
        ws[dir].s = {
          font: { name: "Aptos Narrow", sz: 11, bold: true },
          alignment: { horizontal: "center", vertical: "center", wrapText: true },
          border: bordeDe(BORDES_DCF_ENCABEZADO)
        };
      } else {
        // La primera fila de datos va sin borde arriba, como en el modelo:
        // el encabezado ya cierra con su línea gruesa.
        ws[dir].s = {
          font: { name: "Calibri", sz: 11 },
          alignment: { vertical: "top", horizontal: C === 0 ? "center" : "left", wrapText: true },
          border: { top: R === 2 ? undefined : fina, bottom: fina, left: fina, right: fina }
        };
      }
    }
  }
  // width (y no wch) para que las columnas queden con el ancho exacto del modelo
  ws["!cols"] = ANCHOS_DCF.map(w => ({ width: w }));
  ws["!rows"] = [{ hpt: 21.75 }, { hpt: 45.75 }];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Recopilación Inicio");
  XLSX.writeFile(wb, `ESTADISTICAS_DCFYCCCO_${clave}.xlsx`);
}

// Recordatorio del envío: aparece unos días antes del 10 y deja de
// aparecer apenas se guarda el cierre del mes.
function alertaPlanilla(guardadas) {
  const d = new Date(), clave = claveMes(d), dia = d.getDate();
  if ((guardadas || {})[clave]) return [];
  const donde = "Está en Aspirantes 2da Convocatoria → Estadísticas DCFyCCCO.";
  const out = [];
  if (dia >= DIA_ENVIO_PLANILLA - 4 && dia < DIA_ENVIO_PLANILLA)
    out.push({ id: `planilla-${clave}-aviso`, msg: `Se viene la planilla de Estadísticas DCFyCCCO de ${nombreMes(clave)}: se envía el ${DIA_ENVIO_PLANILLA}. ${donde}` });
  if (dia >= DIA_ENVIO_PLANILLA)
    out.push({ id: `planilla-${clave}-hoy`, msg: `Hay que enviar la planilla de Estadísticas DCFyCCCO de ${nombreMes(clave)}. ${donde}` });
  return out;
}

function PlanillaDCF({ legajos, user, guardados, onGuardarMes, onAbrir }) {
  const mesActual = claveMes(new Date());
  const [mes, setMes] = useState(mesActual);
  const [q, setQ] = useState("");
  const [soloActivos, setSoloActivos] = useState(false);
  const [verGuardado, setVerGuardado] = useState(false);
  const [guardando, setGuardando] = useState(false);
  // Con 21 columnas la tabla no entra en ninguna pantalla: se puede correr al
  // costado, o pasar a "Fichas" y ver la planilla completa de cada aspirante,
  // un dato abajo del otro, sin cortar nada.
  const [modo, setModo] = useState("tabla");

  const guardado = (guardados || {})[mes];
  const esActual = mes === mesActual;
  const mostrarGuardado = !!guardado && (!esActual || verGuardado);
  const puedeCerrar = esAdmin(user) || puedeCargarDatos(user);

  const meses = useMemo(() => {
    const ks = Object.keys(guardados || {});
    if (!ks.includes(mesActual)) ks.push(mesActual);
    return ks.sort().reverse();
  }, [guardados, mesActual]);

  const vivas = useMemo(() => (legajos || [])
    .filter(l => !soloActivos || !esInactivo(l))
    .slice().sort(ordenNombre)
    .map((l, i) => ({ legajo: l, celdas: filaDCF(l, i) })), [legajos, soloActivos]);

  const todas = mostrarGuardado
    ? (guardado.filas || []).map(c => ({ legajo: null, celdas: c }))
    : vivas;

  const nq = norm(q).trim();
  const filas = nq ? todas.filter(f => norm(f.celdas.join(" ")).includes(nq)) : todas;

  const hoyD = new Date();
  const faltan = DIA_ENVIO_PLANILLA - hoyD.getDate();
  const avisar = !guardados || !guardados[mesActual];

  const cerrarMes = async () => {
    setGuardando(true);
    await onGuardarMes(mesActual, vivas.map(f => f.celdas));
    setGuardando(false);
    setVerGuardado(true);
  };

  const cont = { maxWidth: 1700, margin: "0 auto", padding: "0 16px 60px" };
  // En la tabla las celdas muy largas se recortan y el texto completo queda en
  // el globito; en las fichas y en el Excel va siempre entero.
  const celda = (v, j, f) => {
    if (j === 1 && f.legajo && onAbrir) return btnNombre(f.legajo, onAbrir);
    const s = v === "" || v === null || v === undefined ? "—" : String(v);
    return s.length > 44 ? h("span", { title: s }, s.slice(0, 43) + "…") : s;
  };
  const txt = v => v === "" || v === null || v === undefined ? "—" : String(v);

  const botonModo = (k, et, ico) => h("button", {
    className: "btn " + (modo === k ? "" : "btn-ghost"),
    style: { padding: "6px 14px", fontSize: 13 },
    onClick: () => setModo(k)
  }, ico + " " + et);

  // ── Una ficha por aspirante, con las 21 columnas de la planilla ─────────
  const ficha = (f, n) => h("div", {
    key: n,
    className: "card",
    style: { padding: 14, background: "var(--panel2)" }
  },
    h("div", {
      style: {
        display: "flex", alignItems: "baseline", gap: 10, flexWrap: "wrap",
        borderBottom: "1px solid var(--border)", paddingBottom: 9, marginBottom: 10
      }
    },
      h("span", { style: { fontFamily: "'Oswald'", fontSize: 20, color: "var(--acc2)" } }, f.celdas[0]),
      h("span", { style: { fontWeight: 700, fontSize: 15.5, flex: 1, minWidth: 0 } },
        f.legajo && onAbrir ? btnNombre(f.legajo, onAbrir) : txt(f.celdas[1])),
      chipEstado(f.celdas[16])),
    h("div", {
      style: { display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(min(230px,100%),1fr))", gap: "9px 18px" }
    }, COLS_DCF.map((c, k) => k === 0 || k === 1 || k === 16 ? null : h("div", { key: k },
      h("div", {
        style: {
          fontSize: 10.5, color: "var(--txt-dim)", textTransform: "uppercase",
          letterSpacing: .5, marginBottom: 2
        }
      }, c),
      h("div", { style: { fontSize: 13.5, lineHeight: 1.45, wordBreak: "break-word" } }, txt(f.celdas[k]))))));

  return h("div", { className: "fade", style: cont },
    h("h2", { style: { fontSize: 26, color: "var(--acc2)", margin: "22px 0 4px" } }, "Estadísticas DCFyCCCO"),
    h("div", { style: { fontSize: 13, color: "var(--txt-dim)", marginBottom: 16, lineHeight: 1.5 } },
      `La planilla de recopilación de datos que se envía todos los ${DIA_ENVIO_PLANILLA} de cada mes. Se completa sola con lo que hay cargado en los legajos: si alguien carga un dato en una ficha, acá aparece. Se descarga en Excel con el mismo formato del modelo. Cuando cerrás el mes queda guardada tal cual se envió y no se modifica más, aunque después cambien los legajos.`),

    avisar ? h("div", {
      className: "card",
      style: {
        padding: 14, marginBottom: 16, borderLeft: "4px solid var(--coral)",
        background: "rgba(255,107,53,.08)", fontSize: 13.5, lineHeight: 1.55
      }
    }, h("b", { style: { color: "var(--coral)" } }, faltan > 0
      ? `Faltan ${faltan} día${faltan === 1 ? "" : "s"} para enviar la planilla de ${nombreMes(mesActual)}. `
      : `La planilla de ${nombreMes(mesActual)} todavía no está cerrada. `),
      "Descargala, mandala y después tocá “Guardar el cierre del mes” para que quede archivada y deje de avisarte.") : null,

    h("div", { style: { display: "flex", gap: 10, flexWrap: "wrap", alignItems: "center", marginBottom: 14 } },
      h("select", {
        className: "inp", style: { width: "auto", minWidth: 190 },
        value: mes, onChange: e => {
          setMes(e.target.value);
          setVerGuardado(false);
        }
      }, meses.map(k => h("option", { key: k, value: k },
        `${nombreMes(k).replace(/^./, c => c.toUpperCase())}${k === mesActual ? " (mes en curso)" : ""}${(guardados || {})[k] ? " ✔" : ""}`))),
      h("input", {
        className: "inp", style: { width: "auto", flex: "1 1 220px", maxWidth: 340 },
        placeholder: "Buscar en la planilla…",
        value: q, onChange: e => setQ(e.target.value)
      }),
      esActual && !mostrarGuardado ? h("label", { style: { display: "flex", alignItems: "center", gap: 7, fontSize: 13, color: "var(--txt-dim)", cursor: "pointer" } },
        h("input", { type: "checkbox", checked: soloActivos, onChange: e => setSoloActivos(e.target.checked) }),
        "Sólo los que siguen en actividad") : null,
      h("button", {
        className: "btn btn-ghost",
        onClick: () => exportarPlanillaDCF(mes, filas.map(f => f.celdas))
      }, h(I.excel, { style: { width: 16, height: 16 } }), "Descargar Excel"),
      esActual && puedeCerrar ? h("button", {
        className: "btn", disabled: guardando, onClick: cerrarMes
      }, guardando ? "Guardando…" : (guardado ? "Volver a guardar el cierre" : "Guardar el cierre del mes")) : null),

    guardado ? h("div", { style: { fontSize: 12.5, color: "var(--txt-dim)", marginBottom: 12, lineHeight: 1.5 } },
      `Cierre de ${nombreMes(mes)} guardado por ${guardado.autor || "—"} el ${fmtFecha((guardado.guardado || "").slice(0, 10))} · ${guardado.total || (guardado.filas || []).length} aspirantes.`,
      esActual ? h("button", {
        className: "btn btn-ghost",
        style: { marginLeft: 10, padding: "3px 10px", fontSize: 12 },
        onClick: () => setVerGuardado(v => !v)
      }, verGuardado ? "Ver los datos de hoy" : "Ver lo que se guardó") : null) : null,

    h("div", {
      style: { display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center", marginBottom: 12 }
    }, botonModo("tabla", "Tabla", "▦"), botonModo("fichas", "Fichas", "🗂️"),
      h("span", { style: { fontSize: 13, color: "var(--txt-dim)", marginLeft: 6 } },
        `${filas.length} aspirante${filas.length === 1 ? "" : "s"}`,
        mostrarGuardado ? " · planilla cerrada, no se modifica" : " · datos en vivo desde los legajos",
        nq ? ` · filtrando "${q}"` : "")),

    modo === "tabla" ? h("div", null,
      h("div", {
        style: {
          fontSize: 12.5, color: "var(--txt-dim)", marginBottom: 8,
          display: "flex", alignItems: "center", gap: 7, lineHeight: 1.5
        }
      }, h("span", { style: { color: "var(--acc2)", fontSize: 15 } }, "↔"),
        `La planilla tiene ${COLS_DCF.length} columnas y no entran todas en la pantalla: deslizá la tabla hacia el costado para seguir viéndolas. El N° y el apellido quedan fijos. Si preferís verlo todo junto, tocá “Fichas”.`),
      h("div", { className: "card", style: { padding: 4 } },
        h(Tabla, {
          cols: COLS_DCF,
          fijas: 2,
          filas: filas.map(f => f.celdas.map((v, j) => celda(v, j, f))),
          vacio: "Todavía no hay aspirantes cargados."
        }))) : h("div", null,
      h("div", { style: { fontSize: 12.5, color: "var(--txt-dim)", marginBottom: 10, lineHeight: 1.5 } },
        `Los ${COLS_DCF.length} datos de la planilla de cada aspirante, completos y sin recortar. Es la misma información que se descarga en el Excel.`),
      filas.length === 0 ? h("div", {
        className: "card",
        style: { padding: 24, textAlign: "center", color: "var(--txt-dim)" }
      }, "Todavía no hay aspirantes cargados.") : h("div", {
        style: { display: "grid", gap: 12 }
      }, filas.map((f, n) => ficha(f, n)))));

}

// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550
//  PERSONAL DE INSTRUCTORES A CARGO (secciones + gamela y m\u00f3dulos)
// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550
function PersonalACargo({ usuarios, acargo, onGuardar, onGuardarUsuarios, puedeEditar, avisar }) {
  const [mapa, setMapa] = useState(acargo || {});
  const [editMod, setEditMod] = useState("");     // módulo que se está editando
  const [editSec, setEditSec] = useState("");     // sección que se está editando
  const [secIds, setSecIds] = useState({});       // ids elegidos para cada sección, sin guardar
  const [ocupado, setOcupado] = useState(false);
  const [aBorrar, setABorrar] = useState(null);   // { tipo, clave }
  const [editNombre, setEditNombre] = useState(null); // { id, grado, nombre }
  useEffect(() => { setMapa(acargo || {}); }, [acargo]);
  const conMando = (usuarios || []).filter(u => u.rol !== "supervisor");
  const faltanUsuarios = PERSONAL_2DA.filter(f => !buscarEnUsuarios(usuarios, f));
  const aviso = (m, t) => avisar && avisar(m, t);

  // ───────── SECCIONES: se guardan sobre los usuarios ─────────
  const idsDeSeccion = sec => secIds[sec] || aCargoDe(usuarios, sec).map(u => u.id);
  const toggleSec = (sec, id) => {
    const ids = idsDeSeccion(sec);
    setSecIds({ ...secIds, [sec]: ids.includes(id) ? ids.filter(x => x !== id) : [...ids, id] });
  };
  const aplicarSeccion = async (sec, ids) => {
    const nu = (usuarios || []).map(u => {
      const tiene = (u.secciones || []).includes(sec);
      const debe = ids.includes(u.id);
      if (tiene === debe) return u;
      return { ...u, secciones: debe ? [...(u.secciones || []), sec] : (u.secciones || []).filter(x => x !== sec) };
    });
    setOcupado(true);
    try {
      await onGuardarUsuarios(nu);
      const resto = { ...secIds };
      delete resto[sec];
      setSecIds(resto);
      setEditSec("");
      aviso(ids.length ? sec + ": instructores guardados" : sec + " quedó sin instructor a cargo", "ok");
    } catch (e) {
      aviso("No se pudo guardar: " + e.message, "err");
    }
    setOcupado(false);
  };

  // ───────── Corregir el grado o el apellido de un instructor ─────────
  const guardarNombre = async () => {
    if (!editNombre) return;
    const nombre = (editNombre.nombre || "").trim();
    if (!nombre) { aviso("El apellido y nombre no puede quedar vacío", "err"); return; }
    const nu = (usuarios || []).map(u => u.id === editNombre.id
      ? { ...u, grado: (editNombre.grado || "").trim(), nombre } : u);
    setOcupado(true);
    try {
      await onGuardarUsuarios(nu);
      setEditNombre(null);
      aviso("Nombre corregido en todo el sistema", "ok");
    } catch (e) {
      aviso("No se pudo guardar: " + e.message, "err");
    }
    setOcupado(false);
  };

  // ───────── GAMELA Y MÓDULOS: se guardan en la configuración ─────────
  const toggleMod = (modulo, id) => {
    const ids = mapa[modulo] || [];
    setMapa({ ...mapa, [modulo]: ids.includes(id) ? ids.filter(x => x !== id) : [...ids, id] });
  };
  const guardarMod = async (modulo, forzar) => {
    const nuevo = forzar ? { ...mapa, [modulo]: [] } : mapa;
    setOcupado(true);
    const ok = await onGuardar(nuevo);
    if (ok) {
      setMapa(nuevo);
      setEditMod("");
    }
    setOcupado(false);
  };

  // ───────── Cargar la planilla oficial de la 2ª convocatoria ─────────
  const cargarPlanilla = async () => {
    const nuevo = { ...mapa };
    let puestos = 0, conSeccion = 0;
    const sinUsuario = [];
    ALOJAMIENTOS.forEach(m => { nuevo[m] = []; });
    let nuevosUsuarios = [...(usuarios || [])];
    let conRol = 0;
    PERSONAL_2DA.forEach(f => {
      const u = buscarEnUsuarios(usuarios, f);
      if (!u) { sinUsuario.push(f.nombre); return; }
      // rol y secciones a cargo tal como figuran en la planilla
      const secs = f.rol === "supervisor" ? [] : (f.secciones || []);
      const rolPlanilla = f.rol || "instructor";
      const iguales = (u.secciones || []).length === secs.length && secs.every(x => (u.secciones || []).includes(x));
      const mismoRol = (u.rol || "instructor") === rolPlanilla || u.rol === "admin";
      if (!iguales || !mismoRol) {
        nuevosUsuarios = nuevosUsuarios.map(x => x.id === u.id
          ? { ...x, secciones: secs, rol: x.rol === "admin" ? x.rol : rolPlanilla }
          : x);
        if (!iguales) conSeccion++;
        if (!mismoRol) conRol++;
      }
      // gamela y módulos
      (f.modulos || []).forEach(m => {
        if (!nuevo[m]) nuevo[m] = [];
        if (!nuevo[m].includes(u.id)) { nuevo[m].push(u.id); puestos++; }
      });
    });
    setOcupado(true);
    try {
      if (conSeccion || conRol) await onGuardarUsuarios(nuevosUsuarios);
      const ok = await onGuardar(nuevo);
      if (ok) {
        setMapa(nuevo);
        setEditMod("");
        setEditSec("");
        setSecIds({});
        aviso(`Planilla aplicada: ${conSeccion} secci${conSeccion === 1 ? "ón actualizada" : "ones actualizadas"}, ${conRol} rol${conRol === 1 ? "" : "es"} corregido${conRol === 1 ? "" : "s"} y ${puestos} asignación${puestos === 1 ? "" : "es"} de gamela y módulos` +
          (sinUsuario.length ? ` · faltan crear en Usuarios: ${sinUsuario.join(", ")}` : ""), sinUsuario.length ? "err" : "ok");
      }
    } catch (e) {
      aviso("No se pudo aplicar la planilla: " + e.message, "err");
    }
    setOcupado(false);
  };

  // ───────── Exportar las dos planillas ─────────
  const filasSecciones = () => SECCIONES.map(sec => [nombresACargo(usuarios, sec) || "Sin asignar", sec.replace(/\D/g, ""), ""]);
  const filasModulos = () => ALOJAMIENTOS.map(m => [nombresDelModulo(usuarios, mapa, m) || "Sin asignar", m, ""]);
  const hojas = () => [
    ["Secciones", ["Instructor A/C", "Sección", "Notificado"], filasSecciones()],
    ["Gamela y Módulos", ["Instructor A/C", "Módulos (Masc y Fem)", "Notificado"], filasModulos()]
  ];
  const exportarXls = () => exportarHojas("LegajoDigital_PersonalACargo", hojas());
  const exportarPdf = () => exportarPDFHojas("LegajoDigital_PersonalACargo", "Personal de instructores a cargo", [
    ["Personal de instructores a cargo de Sección — 2ª Convocatoria Aspirantes a Agentes Seguridad Año 2026", ["Instructor A/C", "Sección", "Notificado"], filasSecciones()],
    ["Personal de instructores a cargo del control \u201cGamela y Módulos\u201d — 2ª Convocatoria", ["Instructor A/C", "Módulos (Masc y Fem)", "Notificado"], filasModulos()]
  ]);

  // ───────── Piezas visuales ─────────
  const btnMini = (llave, txt, cls, onClick, titulo) => h("button", {
    key: llave, className: "btn " + cls, style: { padding: "4px 10px", fontSize: 12.5 }, onClick, title: titulo || txt, disabled: ocupado
  }, txt);

  const selector = (ids, onToggle) => {
    const puestos = (usuarios || []).filter(u => ids.includes(u.id));
    return h("div", { style: { marginTop: 10 } },
      h("div", { style: { display: "flex", gap: 6, flexWrap: "wrap" } },
        conMando.length ? conMando.map(u => {
          const puesto = ids.includes(u.id);
          return h("button", {
            key: u.id,
            className: "pill-sec" + (puesto ? " on" : ""),
            onClick: () => onToggle(u.id)
          }, (puesto ? "\u2713 " : "") + conGrado(u));
        }) : h("span", { style: { fontSize: 12.5, color: "var(--txt-dim)" } },
          "Todavía no hay instructores creados. Creálos en la pestaña Usuarios y volvé acá.")),
      puestos.length ? h("div", { style: { marginTop: 12, paddingTop: 10, borderTop: "1px dashed var(--border)" } },
        h("div", { style: { fontSize: 11.5, color: "var(--txt-dim)", textTransform: "uppercase", letterSpacing: .7, marginBottom: 8 } },
          "Corregir grado o apellido"),
        h("div", { style: { display: "grid", gap: 6 } }, puestos.map(u =>
          editNombre && editNombre.id === u.id
            ? h("div", { key: u.id, style: { display: "flex", gap: 6, flexWrap: "wrap", alignItems: "center", padding: "8px 10px", background: "var(--panel2)", borderRadius: 9, border: "1px solid var(--acc)" } },
                h("input", {
                  className: "inp", style: { flex: "0 1 140px", minWidth: 110 },
                  value: editNombre.grado, placeholder: "Grado",
                  onChange: e => setEditNombre({ ...editNombre, grado: e.target.value })
                }),
                h("input", {
                  className: "inp", style: { flex: "1 1 180px", minWidth: 150 },
                  value: editNombre.nombre, placeholder: "Apellido y nombre",
                  onChange: e => setEditNombre({ ...editNombre, nombre: e.target.value })
                }),
                btnMini("gn", "\ud83d\udcbe Guardar", "btn-lima", guardarNombre),
                btnMini("cn", "Cancelar", "btn-ghost", () => setEditNombre(null)))
            : h("div", { key: u.id, style: { display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap", padding: "6px 10px", background: "var(--bg2)", borderRadius: 9, border: "1px solid var(--border)" } },
                h("span", { style: { flex: 1, minWidth: 150, fontSize: 13 } }, conGrado(u)),
                btnMini("en", "\u270e Editar nombre", "btn-ghost", () => setEditNombre({ id: u.id, grado: u.grado || "", nombre: u.nombre || "" }))))),
        h("div", { style: { fontSize: 11.5, color: "var(--txt-dim)", marginTop: 8, lineHeight: 1.5 } },
          "El cambio de grado o apellido se guarda en el usuario, as\u00ed que se actualiza en todas las pantallas y en las descargas.")) : null);
  };

  const fila = ({ clave, nombres, editando, ids, onToggle, onEditar, onGuardarFila, onBorrarFila }) => h("div", {
    key: clave,
    style: { padding: "12px 14px", background: "var(--bg2)", borderRadius: 10, border: "1px solid " + (editando ? "var(--acc)" : "var(--border)") }
  }, h("div", { style: { display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap" } },
    h("span", { className: "tag", style: { background: "var(--panel2)", color: "var(--acc2)", minWidth: 92, textAlign: "center" } }, clave),
    h("span", { style: { flex: 1, minWidth: 180, fontSize: 13.5 } },
      nombres || h("i", { style: { color: "var(--coral)" } }, "Sin instructor a cargo")),
    puedeEditar ? h("div", { style: { display: "flex", gap: 6, flexWrap: "wrap" } },
      editando
        ? [btnMini("g", "\ud83d\udcbe Guardar", "btn-lima", onGuardarFila),
           btnMini("c", "Cancelar", "btn-ghost", () => { onEditar(""); })]
        : [btnMini("e", "\u270e Editar", "btn-ghost", () => onEditar(clave)),
           btnMini("b", "\ud83d\uddd1 Borrar", "btn-red", onBorrarFila, "Dejar sin instructores a cargo")]) : null),
    editando ? selector(ids, onToggle) : null);

  const bloque = (titulo, subtitulo, contenido) => h("div", { className: "card", style: { padding: 18, marginBottom: 16 } },
    h("h3", { style: { color: "var(--acc2)", fontSize: 17, marginBottom: 4 } }, titulo),
    h("div", { style: { fontSize: 12.5, color: "var(--txt-dim)", marginBottom: 12, lineHeight: 1.5 } }, subtitulo),
    contenido);

  return h("div", { className: "fade" },
    aBorrar ? h(Confirmar, {
      titulo: aBorrar.tipo === "sec" ? "Dejar la sección sin instructores" : "Dejar el módulo sin instructores",
      texto: aBorrar.tipo === "sec"
        ? `${aBorrar.clave} va a quedar sin instructor a cargo y sus instructores pierden el permiso de cargar los legajos de esa sección.`
        : `${aBorrar.clave} va a quedar sin instructor a cargo en la planilla de control de alojamiento.`,
      textoOk: "Sí, borrar",
      onOk: () => {
        const x = aBorrar;
        setABorrar(null);
        if (x.tipo === "sec") aplicarSeccion(x.clave, []);
        else guardarMod(x.clave, true);
      },
      onCancel: () => setABorrar(null)
    }) : null,
    faltanUsuarios.length ? h("div", {
      className: "card",
      style: { padding: "14px 16px", marginBottom: 16, borderLeft: "4px solid var(--coral)", background: "var(--panel2)" }
    }, h("div", { style: { display: "flex", gap: 10, alignItems: "flex-start", flexWrap: "wrap" } },
      h("span", { style: { fontSize: 20 } }, "\u26a0\ufe0f"),
      h("div", { style: { flex: 1, minWidth: 220 } },
        h("b", { style: { fontFamily: "'Oswald'", fontSize: 15, letterSpacing: .4 } },
          `Falta${faltanUsuarios.length === 1 ? "" : "n"} crear ${faltanUsuarios.length} usuario${faltanUsuarios.length === 1 ? "" : "s"}`),
        h("div", { style: { fontSize: 12.5, color: "var(--txt-dim)", marginTop: 4, lineHeight: 1.5 } },
          "Ac\u00e1 s\u00f3lo aparece gente que ya tiene usuario en el sistema. Estos figuran en la planilla pero todav\u00eda no est\u00e1n creados, por eso no los ves al editar: "),
        h("div", { style: { display: "flex", flexWrap: "wrap", gap: 6, marginTop: 8 } },
          faltanUsuarios.map(f => h("span", {
            key: f.usuario, className: "tag",
            style: { background: "var(--bg2)", color: "var(--coral)", border: "1px solid var(--border)" }
          }, conGrado(f)))),
        h("div", { style: { fontSize: 12.5, color: "var(--txt-dim)", marginTop: 8 } },
          "Cre\u00e1los en la pesta\u00f1a ", h("b", { style: { color: "var(--acc2)" } }, "Usuarios"),
          " \u2192 \u201cPlantel de la 2\u00aa convocatoria\u201d \u2192 ", h("b", null, "Crear usuario"),
          ", y despu\u00e9s volv\u00e9 ac\u00e1.")))) : null,
    h("div", { style: { display: "flex", gap: 10, flexWrap: "wrap", alignItems: "center", marginBottom: 14 } },
      h("button", { className: "btn btn-ghost", onClick: exportarXls }, h(I.excel, { style: { width: 16, height: 16 } }), "Excel de las dos planillas"),
      h("button", { className: "btn btn-coral", onClick: exportarPdf }, h(I.pdf, { style: { width: 16, height: 16 } }), "PDF de las dos planillas"),
      puedeEditar ? h("button", { className: "btn btn-lima", onClick: cargarPlanilla, disabled: ocupado },
        "\ud83d\udc6e Cargar el personal a cargo de la planilla") : null),
    puedeEditar ? h("div", { style: { fontSize: 12, color: "var(--txt-dim)", marginBottom: 16, lineHeight: 1.5, borderLeft: "3px solid var(--coral)", paddingLeft: 10 } },
      "Este bot\u00f3n no toca ning\u00fan legajo ni tiene que ver con el Excel de aspirantes: s\u00f3lo completa de una vez qui\u00e9n est\u00e1 a cargo de qu\u00e9, seg\u00fan la planilla oficial de instructores. Secciones \u2014 1: Calder\u00f3n y Oses \u00b7 2: Euliarte y Seguel \u00b7 3: Castillo y Ram\u00edrez \u00b7 4: Y\u00e1\u00f1ez, Sanhueza y L\u00f3pez \u00b7 5: Romero, Quevedo y Riquelme. Gamela y m\u00f3dulos \u2014 Gamela: Euliarte, Castillo, Romero, Oses y L\u00f3pez \u00b7 M\u00f3dulo 2: Calder\u00f3n y Sanhueza \u00b7 M\u00f3dulo 3: Y\u00e1\u00f1ez y Riquelme \u00b7 M\u00f3dulos 4 y 5: Quevedo, Seguel y Ram\u00edrez. Ojo: pisa lo que ya tengas cargado a mano. Si a alguno le falta el usuario, te aviso el nombre para que lo crees en la pesta\u00f1a Usuarios.") : null,

    bloque("Instructores a cargo de Secci\u00f3n",
      puedeEditar
        ? "La secci\u00f3n que tiene cada instructor a cargo es la que le habilita los legajos que puede cargar y editar. Toc\u00e1 Editar para cambiarla ac\u00e1 mismo: se guarda tambi\u00e9n en Usuarios."
        : "Qui\u00e9n est\u00e1 a cargo de cada secci\u00f3n. S\u00f3lo las administradoras pueden modificarlo.",
      h("div", { style: { display: "grid", gap: 8 } }, SECCIONES.map(sec => {
        const ids = idsDeSeccion(sec);
        const arr = (usuarios || []).filter(u => ids.includes(u.id));
        return fila({
          clave: sec,
          nombres: arr.length ? arr.map(conGrado).join(" \u00b7 ") : "",
          editando: editSec === sec,
          ids,
          onToggle: id => toggleSec(sec, id),
          onEditar: v => { setEditSec(v); setEditMod(""); },
          onGuardarFila: () => aplicarSeccion(sec, ids),
          onBorrarFila: () => setABorrar({ tipo: "sec", clave: sec })
        });
      }))),

    bloque("Instructores a cargo de Gamela y M\u00f3dulos",
      puedeEditar
        ? "Planilla de control de alojamiento. Toc\u00e1 Editar y despu\u00e9s a cada instructor para ponerlo o sacarlo: una misma persona puede estar en m\u00e1s de un m\u00f3dulo y esto no cambia qu\u00e9 legajos puede editar."
        : "Planilla de control de alojamiento. S\u00f3lo las administradoras pueden modificarla.",
      h("div", { style: { display: "grid", gap: 10 } }, ALOJAMIENTOS.map(m => {
        const ids = mapa[m] || [];
        const arr = (usuarios || []).filter(u => ids.includes(u.id));
        return fila({
          clave: m,
          nombres: arr.length ? arr.map(conGrado).join(" \u00b7 ") : "",
          editando: editMod === m,
          ids,
          onToggle: id => toggleMod(m, id),
          onEditar: v => { setEditMod(v); setEditSec(""); if (!v) setMapa(acargo || {}); },
          onGuardarFila: () => guardarMod(m),
          onBorrarFila: () => setABorrar({ tipo: "mod", clave: m })
        });
      }))));
}

// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550
//  DISTRIBUCI\u00d3N DE ALOJAMIENTO DEL DCFyCCCO
// ══════════════════════════════════════════════════════════
const COLS_ALOJ = ["N°", "Apellido y Nombre", "DNI", "Edad", "Sexo", "Habitación", "Sección"];
const filaAlojTexto = (l, i) => [i + 1, nombreDe(l), l.dni || "", l.edad || "", l.sexo || "", habDe(l), l.seccion || "Sin asignar"];

function AlojamientoVista({ legajos, onAbrir, usuarios, acargo, user, onGuardar }) {
  const [sub, setSub] = useState(ALOJAMIENTOS[0]);
  const [q, setQ] = useState("");
  const [mover, setMover] = useState(null);
  const [dest, setDest] = useState("");
  const [hab, setHab] = useState("");
  const [busy, setBusy] = useState(false);

const prettyClave = k => {
  const t = String(k).replace(/([a-z0-9])([A-Z])/g, "$1 $2").replace(/[_-]+/g, " ").trim().toLowerCase();

  .filter(k => k !== "id" && k !== "cargado")
  .map(k => {
    if (esClaveArchivo(k)) return o[k] ? etiqClave(k) + ": Sí" : "";
    const t = mostrarValor(o[k]);
    return t ? etiqClave(k) + ": " + t : "";
  }).filter(Boolean).join(", ");
function mostrarValor(v) {
  if (v === undefined || v === null || v === "") return "";
  if (v === true) return "Sí";
  if (v === false) return "No";
  if (Array.isArray(v)) return v.map(x => x && typeof x === "object" ? resumenItem(x) : mostrarValor(x)).filter(Boolean).join("  |  ");
  if (typeof v === "object") return resumenItem(v);
  if (esTextoFecha(v)) return fmtFecha(v);

// Recorre el legajo y anota la ruta de cada dato que encuentra
function rutasDe(o, pre, salida, tipos) {
  Object.keys(o || {}).forEach(k => {
    const r = pre ? pre + "." + k : k;
    const v = o[k];
    if (v && typeof v === "object" && !Array.isArray(v)) {
      rutasDe(v, r, salida, tipos);
    } else {
      if (salida.indexOf(r) < 0) salida.push(r);
      if (Array.isArray(v)) tipos[r] = "lista";
      else if (!tipos[r]) tipos[r] = "dato";
    }
  });
}

// Arma los bloques y sus columnas a partir de los datos que existen
function armarMadre(legajos) {
  const rutas = [];
  const tipos = {};
  rutasDe(nuevoLegajo(), "", rutas, tipos);
  (legajos || []).forEach(l => rutasDe(l, "", rutas, tipos));
  const porBloque = {};
  const listas = [];
  rutas.forEach(r => {
    if (RUTAS_APARTE.indexOf(r) >= 0) return;
    const raiz = r.split(".")[0];
    const b = BLOQUE_DE_RAIZ[raiz] || "otros";
    const et = etiqRuta(r);
    const col = tipos[r] === "lista"
      ? [[et + " (cantidad)", l => (valorEn(l, r) || []).length || ""], [et, l => mostrarValor(valorEn(l, r))]]
      : esClaveArchivo(r.split(".").pop())
        ? [[et, l => valorEn(l, r) ? "Sí" : "No"]]
        : [[et, l => mostrarValor(valorEn(l, r))]];
    (porBloque[b] = porBloque[b] || []).push(...col);
    if (tipos[r] === "lista") listas.push(r);
  });
  const grupos = BLOQUES_MADRE.map(([id, nombre, emoji]) => ({
    id, nombre, emoji,
    fijo: id === "ident",
    cols: (COLS_A_MANO[id] || []).concat(porBloque[id] || [])
  })).filter(g => g.cols.length);
  // Hojas de detalle: una fila por hijo, por sanción, por novedad, etc.
  const hojas = [];
  const usados = {};
  listas.forEach(r => {
    const claves = [];
    (legajos || []).forEach(l => (valorEn(l, r) || []).forEach(it => {
      if (it && typeof it === "object") Object.keys(it).forEach(k => {
        if (k !== "id" && claves.indexOf(k) < 0) claves.push(k);
      });
    }));
    if (!claves.length) return;
    let nombre = etiqClave(r.split(".").pop()).slice(0, 31);
    usados[nombre] = (usados[nombre] || 0) + 1;
    if (usados[nombre] > 1) nombre = (nombre + " " + usados[nombre]).slice(0, 31);
    hojas.push([nombre, claves.map(etiqClave), r, claves]);
  });
  return { grupos, hojas };
}

const etiquetasDe = cols => cols.map(c => c[0]);

});

const celdaMadre = (c, l, i, onAbrir) => {
  if (c[2]) return c[2](l, i, onAbrir);
  const bruto = c[1](l, i);
  const v = String(bruto === undefined || bruto === null ? "" : bruto);
  if (!v.trim()) return h("span", { style: { color: "var(--txt-dim)" } }, "—");
  if (v.length <= 46) return v;
  return h("span", { title: v, style: { cursor: "help", borderBottom: "1px dotted var(--border)" } }, v.slice(0, 44) + "…");
};
const hojaDetalleMadre = (legajos, [nombre, cols, ruta, claves]) => {
  const filas = [];
  legajos.forEach(l => (valorEn(l, ruta) || []).forEach(it => {
    if (!it || typeof it !== "object") return;
    filas.push([nombreDe(l), l.dni || "", l.seccion || "Sin asignar", ...claves.map(k => mostrarValor(it[k]))]);
  }));
  return [nombre, ["Aspirante", "DNI", "Sección", ...cols], filas];
};

  const [prendidos, setPrendidos] = useState(MADRE_INICIAL);
  const todos = useMemo(() => [...(legajos || [])].sort(ordenNombre), [legajos]);
  const { grupos, hojas } = useMemo(() => armarMadre(todos), [todos]);
  const todasCols = useMemo(() => grupos.flatMap(g => g.cols), [grupos]);
  const opcionales = grupos.filter(g => !g.fijo);
  const cols = grupos.filter(g => g.fijo || prendidos.indexOf(g.id) >= 0).flatMap(g => g.cols);
  // Todo el legajo en un solo texto, para que el buscador encuentre por cualquier dato
  const textos = useMemo(() => {
    const m = {};
    todos.forEach((l, i) => { m[l.id] = norm(filaDe(todasCols, l, i).join(" ")); });
    return m;
  }, [todos, todasCols]);
  const nq = norm(q).trim();
  const filas = todos.filter(l =>
    (!fEst || (l.estado || "Activo") === fEst) &&
    (!nq || (textos[l.id] || "").includes(nq)));
  const cuenta = e => todos.filter(l => (l.estado || "Activo") === e).length;
  const cont = { maxWidth: 1300, margin: "0 auto", padding: "0 16px 60px" };
  const prender = id => setPrendidos(gs => gs.indexOf(id) >= 0 ? gs.filter(x => x !== id) : [...gs, id]);
  const excelCompleto = () => exportarHojas("LegajoDigital_ListadoMadre_Completo",
    [["Listado madre", etiquetasDe(todasCols), filas.map((l, i) => filaDe(todasCols, l, i))]]
      .concat(hojas.map(hd => hojaDetalleMadre(filas, hd))));
  return h("div", { className: "fade", style: cont },
    h("h2", { style: { fontSize: 26, color: "var(--acc2)", margin: "22px 0 4px" } }, "Listado madre"),
    h("div", { style: { fontSize: 13, color: "var(--txt-dim)", marginBottom: 16, lineHeight: 1.5 } },
      "El listado completo de la convocatoria con TODO lo que se carga en cada legajo: están todos, los que siguen y los que no — bajas, desistimientos, desafectados y egresados. Las columnas se arman leyendo los legajos, así que cualquier dato que alguien cargue en cualquier pestaña aparece acá solo y se puede filtrar. Es el listado que no se toca: de acá sale cualquier informe histórico."),
    h("div", { style: { display: "flex", gap: 7, flexWrap: "wrap", marginBottom: 14 } },
      h("button", { className: "pill-sec" + (fEst === "" ? " on" : ""), onClick: () => setFEst("") }, "Todos ", h("b", null, todos.length)),
      ESTADOS_ASP.map(e => h("button", {
        key: e,
        className: "pill-sec" + (fEst === e ? " on" : ""),
        onClick: () => setFEst(e)
      }, e, " ", h("b", null, cuenta(e))))),
    h("div", { className: "card", style: { padding: "14px 15px", marginBottom: 14 } },
      h("div", { style: { display: "flex", gap: 10, flexWrap: "wrap", alignItems: "center", marginBottom: 10 } },
        h("span", { style: { fontFamily: "'Oswald'", letterSpacing: .6, color: "var(--coral2)", fontSize: 13 } }, "QUÉ MOSTRAR EN PANTALLA"),
        h("span", { style: { fontSize: 12, color: "var(--txt-dim)", flex: "1 1 auto" } },
          `${cols.length} columnas a la vista de ${todasCols.length} que tiene el legajo`),
        h("button", { className: "btn btn-ghost", style: { padding: "5px 11px", fontSize: 12 }, onClick: () => setPrendidos(opcionales.map(g => g.id)) }, "Mostrar todo"),
        h("button", { className: "btn btn-ghost", style: { padding: "5px 11px", fontSize: 12 }, onClick: () => setPrendidos(MADRE_INICIAL) }, "Volver a lo básico")),
      h("div", { style: { display: "flex", gap: 7, flexWrap: "wrap" } },
        opcionales.map(g => h("button", {
          key: g.id,
          className: "pill-sec" + (prendidos.indexOf(g.id) >= 0 ? " on" : ""),
          onClick: () => prender(g.id),
          title: `${g.cols.length} columnas`
        }, g.emoji, " ", g.nombre, " ", h("b", null, g.cols.length)))),
      h("div", { style: { fontSize: 12, color: "var(--txt-dim)", marginTop: 10, lineHeight: 1.5 } },
        "Prendé sólo los bloques que necesitás mirar y la tabla se corre para el costado; el N° y el apellido quedan siempre a la vista. Las celdas largas se recortan: apoyate sobre el texto para verlo entero, o tocá el apellido para abrir el legajo completo. El Excel completo baja las ",
        todasCols.length, " columnas, estén prendidas o no.")),
    h("div", { style: { display: "flex", gap: 10, flexWrap: "wrap", alignItems: "center", marginBottom: 12 } },
      h("input", {
        className: "inp", style: { width: "auto", flex: "1 1 240px", maxWidth: 380 },
        placeholder: "Buscar en todo el legajo: apellido, DNI, domicilio, motivo, novedad…",
        value: q, onChange: e => setQ(e.target.value)
      }),
      h("button", { className: "btn btn-lima", onClick: excelCompleto },
        h(I.excel, { style: { width: 16, height: 16 } }), "Excel completo"),
      h("button", {
        className: "btn btn-ghost",
        onClick: () => exportarHojas("LegajoDigital_ListadoMadre", [["Listado madre", etiquetasDe(cols), filas.map((l, i) => filaDe(cols, l, i))]])
      }, h(I.excel, { style: { width: 16, height: 16 } }), "Excel de lo que veo"),
      h("button", {
        className: "btn btn-coral",
        onClick: () => exportarPDFHojas("LegajoDigital_ListadoMadre", "Listado madre",
          [[`Listado madre · ${filas.length} aspirante${filas.length === 1 ? "" : "s"}`, etiquetasDe(cols), filas.map((l, i) => filaDe(cols, l, i))]], true)
      }, h(I.pdf, { style: { width: 16, height: 16 } }), "PDF de lo que veo")),
    h("div", { style: { fontSize: 12.5, color: "var(--txt-dim)", marginBottom: 12, lineHeight: 1.5 } },
      `${filas.length} aspirante${filas.length === 1 ? "" : "s"}`,
      fEst ? ` · ${fEst}` : "",
      nq ? ` · filtrando "${q}"` : "",
      ` · El Excel completo trae la hoja del listado con las ${todasCols.length} columnas y, aparte, ${hojas.length} hoja${hojas.length === 1 ? "" : "s"} de detalle con una fila por registro (hijos, estudios, empleos, sanciones, expedientes, novedades, permisos, y cualquier lista que se agregue después). Para el PDF conviene dejar prendidos pocos bloques, si no las columnas quedan muy finitas.`),
    h("div", { className: "card", style: { padding: 4 } },
      h(Tabla, {
        cols: etiquetasDe(cols),
        filas: filas.map((l, i) => cols.map(c => celdaMadre(c, l, i, onAbrir))),
        fijas: 2,
        vacio: "No hay aspirantes cargados todavía."
      })));
}

// ══════════════════════════════════════════════════════════
//  ASISTENCIA DEL DÍA Y PERMISOS PARA RETIRARSE TEMPRANO
//  Se cargan desde la cabecera de la ficha y se resumen en la pizarra
// ══════════════════════════════════════════════════════════
function AccionesFicha({ l, autor, editable, onCambio }) {
  const [abierto, setAbierto] = useState(false);
  const [fecha, setFecha] = useState(hoy());
  const [hora, setHora] = useState("");
  const [motivo, setMotivo] = useState("");
  const [estado, setEstado] = useState(ESTADOS_PERMISO[0]);
  const [busy, setBusy] = useState(false);
  const permisos = [...(l.permisos || [])].sort((a, b) => (b.fecha || "").localeCompare(a.fecha || ""));
  const marcar = async v => {
    if (!editable) return;
    await onCambio({ asistencia: v, asistenciaFecha: v ? hoy() : "" });
  };
  const guardarPermiso = async () => {
    if (!motivo.trim()) return;
    setBusy(true);
    await onCambio({
      permisos: [...(l.permisos || []), {
        id: uid(), fecha, hora: (hora || "").trim(), motivo: motivo.trim(), estado,
        autor: autor || "", cargado: new Date().toISOString()
      }]
    });
    setBusy(false);
    setMotivo("");
    setHora("");
    setEstado(ESTADOS_PERMISO[0]);
    setFecha(hoy());
    setAbierto(false);
  };
  const borrarPermiso = async id => {
    await onCambio({ permisos: (l.permisos || []).filter(x => x.id !== id) });
  };
  const btnAsist = v => {
    const puesto = (l.asistencia || "") === v;
    const c = v === "Presente" ? "var(--green)" : "var(--red)";
    return h("button", {
      key: v,
      className: "btn",
      disabled: !editable,
      style: {
        padding: "7px 15px", fontSize: 13, fontWeight: 700,
        background: puesto ? c : "var(--bg2)",
        color: puesto ? "#0c1207" : "var(--txt-dim)",
        borderColor: puesto ? "transparent" : "var(--border)",
        opacity: editable ? 1 : .65
      },
      onClick: () => marcar(puesto ? "" : v)
    }, v === "Presente" ? "✓ Presente" : "✕ Ausente");
  };
  return h("div", { style: { flexBasis: "100%", borderTop: "1px solid var(--border)", paddingTop: 14 } },
    h("div", { style: { display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap" } },
      h("span", { style: { fontFamily: "'Oswald'", fontSize: 15, letterSpacing: 1, color: "var(--acc2)", textTransform: "uppercase" } }, "Asistencia"),
      ASISTENCIA.map(btnAsist),
      l.asistencia
        ? h("span", { style: { fontSize: 11.5, color: "var(--txt-dim)" } },
            l.asistenciaFecha ? `cargada el ${fmtFecha(l.asistenciaFecha)}` : "sin fecha de carga")
        : h("span", { style: { fontSize: 11.5, color: "var(--txt-dim)" } }, "todavía sin cargar")),
    h("div", { style: { display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap", marginTop: 14 } },
      h("span", { style: { fontFamily: "'Oswald'", fontSize: 15, letterSpacing: 1, color: "var(--acc2)", textTransform: "uppercase" } }, "Permisos para retirarse"),
      h("span", { className: "tag", style: { background: "var(--bg2)", color: permisos.length ? "var(--amber)" : "var(--txt-dim)", fontSize: 11 } },
        permisos.length ? `${permisos.length} pedido${permisos.length === 1 ? "" : "s"}` : "nunca pidió"),
      h("span", { style: { flex: 1 } }),
      editable ? h("button", {
        className: abierto ? "btn btn-ghost" : "btn btn-lima",
        style: { padding: "6px 13px", fontSize: 12.5 },
        onClick: () => setAbierto(v => !v)
      }, abierto ? "Cerrar" : "＋ Solicita permiso para retirarse temprano") : null),
    abierto ? h("div", {
      style: { marginTop: 12, background: "var(--bg2)", border: "1px solid var(--border)", borderRadius: 12, padding: 14 }
    }, h("div", { style: { display: "flex", gap: 12, flexWrap: "wrap" } },
      h("div", { style: { flex: "0 1 165px" } },
        h("label", { style: { fontSize: 11.5, color: "var(--txt-dim)" } }, "Fecha del franco"),
        h("input", { className: "inp", type: "date", value: fecha, onChange: e => setFecha(e.target.value) })),
      h("div", { style: { flex: "0 1 130px" } },
        h("label", { style: { fontSize: 11.5, color: "var(--txt-dim)" } }, "Hora de salida"),
        h("input", { className: "inp", type: "time", value: hora, onChange: e => setHora(e.target.value) })),
      h("div", { style: { flex: "1 1 190px" } },
        h("label", { style: { fontSize: 11.5, color: "var(--txt-dim)" } }, "Resolución"),
        h("select", { className: "inp", value: estado, onChange: e => setEstado(e.target.value) },
          ESTADOS_PERMISO.map(x => h("option", { key: x, value: x }, x))))),
      h("label", { style: { fontSize: 11.5, color: "var(--txt-dim)", display: "block", marginTop: 10 } }, "Motivo que da el aspirante"),
      h("textarea", {
        className: "inp", rows: 2, style: { resize: "vertical", fontFamily: "inherit" },
        placeholder: "Por qué pide retirarse antes…",
        value: motivo, onChange: e => setMotivo(e.target.value)
      }),
      h("div", { style: { display: "flex", gap: 8, justifyContent: "flex-end", marginTop: 10, flexWrap: "wrap" } },
        h("button", { className: "btn btn-ghost", onClick: () => { setAbierto(false); setMotivo(""); } }, "Cancelar"),
        h("button", { className: "btn btn-gold", disabled: busy || !motivo.trim(), onClick: guardarPermiso },
          busy ? h("span", { className: "spin" }) : "Guardar el pedido")),
      h("div", { style: { fontSize: 11.5, color: "var(--txt-dim)", marginTop: 8, lineHeight: 1.45 } },
        "Se guarda solo y suma al recuento de la pizarra. La lista completa de pedidos está en la pestaña Legajo operativo.")) : null,
    permisos.length ? h("div", { style: { display: "grid", gap: 6, marginTop: 12 } },
      permisos.slice(0, 3).map(p => h("div", {
        key: p.id, className: "nov-item", style: { "--nota-c": colorPermiso(p.estado) }
      }, h("div", { style: { display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap" } },
        h("b", { style: { color: colorPermiso(p.estado), fontSize: 12.5 } }, p.estado || "Solicitado"),
        h("span", { style: { color: "var(--txt-dim)", fontSize: 11.5 } },
          fmtFecha(p.fecha) + (p.hora ? " · " + p.hora + " hs" : "")),
        h("span", { style: { flex: 1 } }),
        editable ? h("button", {
          className: "iconbtn", title: "Borrar este pedido", style: { padding: "0 4px", fontSize: 12 },
          onClick: () => borrarPermiso(p.id)
        }, "✕") : null),
        h("div", { style: { marginTop: 3 } }, p.motivo || ""))),
      permisos.length > 3 ? h("div", { style: { fontSize: 11.5, color: "var(--txt-dim)" } },
        `+${permisos.length - 3} pedido${permisos.length - 3 === 1 ? "" : "s"} más en la pestaña Legajo operativo`) : null) : null);
}

// Resumen de asistencia de la pizarra: presentes, ausentes y sin cargar,
// discriminados en femeninos, masculinos y total
function PanelAsistencia({ legajos, onAbrir, esAdministradora, onLimpiar }) {
  const [confirmar, setConfirmar] = useState(false);
  const [limpiando, setLimpiando] = useState(false);
  const activos = useMemo(() => (legajos || []).filter(l => !esInactivo(l)), [legajos]);
  const cuenta = pred => {
    const arr = activos.filter(pred);
    return {
      t: arr.length,
      f: arr.filter(l => l.sexo === "Femenino").length,
      m: arr.filter(l => l.sexo === "Masculino").length,
      sn: arr.filter(l => l.sexo !== "Femenino" && l.sexo !== "Masculino").length,
      arr
    };
  };
  const pres = cuenta(l => l.asistencia === "Presente");
  const aus = cuenta(l => l.asistencia === "Ausente");
  const sin = cuenta(l => !l.asistencia);
  const tot = cuenta(() => true);
  const deHoy = activos.filter(l => l.asistencia && l.asistenciaFecha === hoy()).length;
  const viejas = activos.filter(l => l.asistencia && l.asistenciaFecha && l.asistenciaFecha !== hoy());
  const caja = (titulo, d, color, emoji) => h("div", {
    className: "card",
    style: { padding: 15, background: "var(--panel2)", borderLeft: `4px solid ${color}` }
  }, h("div", { style: { display: "flex", alignItems: "baseline", gap: 8 } },
    h("span", { style: { fontSize: 15 } }, emoji),
    h("span", { style: { fontSize: 30, fontFamily: "'Oswald'", color, lineHeight: 1 } }, d.t),
    h("span", { style: { fontSize: 11.5, color: "var(--txt-dim)", textTransform: "uppercase", letterSpacing: .6 } }, titulo)),
    h("div", { style: { display: "flex", gap: 8, marginTop: 9, flexWrap: "wrap" } },
      h("span", { className: "tag", style: { background: "var(--bg2)", color: "var(--txt)", fontSize: 11.5 } }, `♀ Fem. ${d.f}`),
      h("span", { className: "tag", style: { background: "var(--bg2)", color: "var(--txt)", fontSize: 11.5 } }, `♂ Masc. ${d.m}`),
      d.sn ? h("span", { className: "tag", style: { background: "var(--bg2)", color: "var(--txt-dim)", fontSize: 11.5 } }, `sin sexo ${d.sn}`) : null));
  const COLS_ASIST = ["Sección", "Presentes", "Ausentes", "Sin cargar", "Total"];
  const porSeccion = SECCIONES.concat(["Sin asignar"]).map(sec => {
    const dela = activos.filter(l => (l.seccion || "Sin asignar") === sec);
    return [sec, dela.filter(l => l.asistencia === "Presente").length, dela.filter(l => l.asistencia === "Ausente").length,
      dela.filter(l => !l.asistencia).length, dela.length];
  }).filter(f => f[4] > 0);
  const filasAsistExcel = () => activos.slice().sort(ordenNombre).map((l, i) =>
    [i + 1, nombreDe(l), l.dni || "", l.sexo || "", l.seccion || "Sin asignar", l.asistencia || "Sin cargar", fmtFecha(l.asistenciaFecha)]);
  return h("div", { className: "card", style: { padding: 20, marginBottom: 18 } },
    h("div", { style: { display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap", marginBottom: 4 } },
      h("h3", { style: { color: "var(--acc2)", fontSize: 18, flex: "1 1 200px" } }, "Asistencia de los aspirantes"),
      h("button", {
        className: "btn btn-ghost", style: { fontSize: 12, padding: "6px 12px" },
        onClick: () => exportarHojas("LegajoDigital_Asistencia", [
          ["Asistencia", ["N°", "Apellido y Nombre", "DNI", "Sexo", "Sección", "Asistencia", "Cargada el"], filasAsistExcel()],
          ["Resumen", COLS_ASIST, porSeccion.concat([["TOTAL", pres.t, aus.t, sin.t, tot.t]])]
        ])
      }, h(I.excel, { style: { width: 15, height: 15 } }), "Excel"),
      esAdministradora && onLimpiar ? (confirmar
        ? h("span", { style: { display: "flex", gap: 6, flexWrap: "wrap" } },
            h("button", {
              className: "btn btn-red", style: { fontSize: 12, padding: "6px 12px" }, disabled: limpiando,
              onClick: async () => {
                setLimpiando(true);
                await onLimpiar();
                setLimpiando(false);
                setConfirmar(false);
              }
            }, limpiando ? "Limpiando…" : "Sí, borrar la asistencia de todos"),
            h("button", { className: "btn btn-ghost", style: { fontSize: 12, padding: "6px 12px" }, onClick: () => setConfirmar(false) }, "No"))
        : h("button", {
            className: "btn btn-ghost", style: { fontSize: 12, padding: "6px 12px" },
            onClick: () => setConfirmar(true)
          }, "🧹 Empezar la asistencia del día")) : null),
    h("div", { style: { fontSize: 12.5, color: "var(--txt-dim)", marginBottom: 14, lineHeight: 1.5 } },
      `${tot.t} aspirantes en actividad · ${deHoy} con la asistencia cargada hoy${sin.t ? ` · ${sin.t} sin cargar todavía` : " · están todos cargados"}. La asistencia de cada uno se marca en su ficha, en el recuadro de arriba.`),
    h("div", { style: { display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(min(215px,100%),1fr))", gap: 12 } },
      caja("presentes", pres, "var(--green)", "✅"),
      caja("ausentes", aus, "var(--red)", "❌"),
      caja("sin cargar", sin, "var(--amber)", "❔"),
      caja("en actividad", tot, "var(--acc2)", "👥")),
    viejas.length ? h("div", {
      style: { marginTop: 16, display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap", background: "var(--bg2)", border: "1px solid var(--border)", borderLeft: "4px solid var(--amber)", borderRadius: 12, padding: "12px 14px" }
    }, h("span", { style: { fontSize: 18 } }, "⚠️"),
      h("span", { style: { fontSize: 12.5, flex: "1 1 220px", lineHeight: 1.5 } },
        h("b", null, `${viejas.length} marca${viejas.length === 1 ? "" : "s"} ${viejas.length === 1 ? "es" : "son"} de días anteriores`),
        " — quedaron como estaban la última vez que se cargó la asistencia."),
      esAdministradora && onLimpiar ? h("button", {
        className: "btn btn-ghost", style: { fontSize: 12, padding: "6px 12px" },
        onClick: () => setConfirmar(true)
      }, "🧹 Dejarlas en blanco") : null) : null,
    aus.t ? h("div", { style: { marginTop: 16 } },
      h("div", { style: { fontSize: 12.5, color: "var(--txt-dim)", marginBottom: 7 } },
        `Quién falta hoy (${aus.t}) — tocá el nombre para abrir el legajo:`),
      h("div", { style: { display: "flex", flexWrap: "wrap", gap: 6 } },
        aus.arr.slice().sort(ordenNombre).map(l => h("button", {
          key: l.id, className: "tag",
          style: { background: "rgba(255,90,82,.12)", color: "var(--red)", border: "1px solid rgba(255,90,82,.35)", cursor: "pointer" },
          onClick: () => onAbrir(l)
        }, `${nombreDe(l)}${l.seccion ? " · " + l.seccion.replace("Sección ", "Sec. ") : ""}`)))) : null,
    porSeccion.length > 1 ? h("div", { style: { marginTop: 16 } },
      h("div", { className: "card", style: { padding: 4 } },
        h(Tabla, {
          cols: COLS_ASIST,
          filas: porSeccion.map(f => [f[0],
            h("b", { style: { color: "var(--green)" } }, f[1]),
            h("b", { style: { color: f[2] ? "var(--red)" : "var(--txt-dim)" } }, f[2]),
            h("span", { style: { color: f[3] ? "var(--amber)" : "var(--txt-dim)" } }, f[3]),
            h("b", { style: { color: "var(--acc2)" } }, f[4])]),
          vacio: "Sin secciones cargadas."
        }))) : null);
}

// Recuento de permisos para retirarse temprano: sirve para ver si siempre
// son los mismos los que piden
function PanelPermisos({ legajos, onAbrir }) {
  const [verTodos, setVerTodos] = useState(false);
  const todos = useMemo(() => {
    const out = [];
    (legajos || []).forEach(l => (l.permisos || []).forEach(p => out.push({ ...p, legajo: l })));
    return out.sort((a, b) => (b.fecha || "").localeCompare(a.fecha || ""));
  }, [legajos]);
  if (!todos.length) return null;
  const mes = hoy().slice(0, 7);
  const delMes = todos.filter(p => (p.fecha || "").slice(0, 7) === mes).length;
  const porAspirante = {};
  todos.forEach(p => {
    const k = p.legajo.id;
    if (!porAspirante[k]) porAspirante[k] = { legajo: p.legajo, n: 0, ultima: "", mes: 0 };
    porAspirante[k].n++;
    if ((p.fecha || "") > porAspirante[k].ultima) porAspirante[k].ultima = p.fecha || "";
    if ((p.fecha || "").slice(0, 7) === mes) porAspirante[k].mes++;
  });
  const ranking = Object.values(porAspirante).sort((a, b) => b.n - a.n || ordenNombre(a.legajo, b.legajo));

function descargarRespaldo(legajos, usuarios, accesos, recorrido) {
  const datos = { app: "Legajo Digital del Aspirante", version: APP_VER, generado: new Date().toISOString(), legajos, usuarios: (usuarios || []).map(u => ({ ...u, hash: "(oculto)" })), accesos, recorrido };
  const url = URL.createObjectURL(new Blob([JSON.stringify(datos, null, 2)], { type: "application/json" }));
  const a = document.createElement("a");
  a.href = url;
  a.download = `LegajoDigital_respaldo_${hoy()}.json`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 3000);
}
// fijas: cuántas columnas de la izquierda quedan clavadas al correr la tabla
// para el costado (sirve cuando hay muchísimas columnas: siempre se ve de quién
// es cada fila). Soporta hasta 2 y por defecto está apagado.
const ANCHOS_FIJOS = [42, 170];
function Tabla({ cols, filas, vacio, fijas }) {
  const nf = Math.min(fijas || 0, 2);
  const izqDe = j => j === 0 ? 0 : ANCHOS_FIJOS[0];
  const fija = (j, fondo) => j >= nf ? null : {
    position: "sticky",
    left: izqDe(j),
    background: fondo,
    minWidth: ANCHOS_FIJOS[j],
    borderRight: j === nf - 1 ? "1px solid var(--border)" : undefined
  };
  return h("div", { style: { overflowX: "auto" } },
    h("table", { style: { width: "100%", borderCollapse: "collapse", fontSize: 13 } },
      h("thead", null, h("tr", null, cols.map((c, j) => h("th", {
        key: j,
        style: {
          textAlign: "left", padding: "10px 10px", background: "var(--panel2)", color: "var(--acc2)",
          fontFamily: "'Oswald'", letterSpacing: .5, whiteSpace: "nowrap", position: "sticky", top: 0,
          zIndex: j < nf ? 4 : 1,
          ...(fija(j, "var(--panel2)") || {})
        }
      }, c)))),
      h("tbody", null,
        filas.length === 0 ? h("tr", null, h("td", { colSpan: cols.length, style: { padding: 24, textAlign: "center", color: "var(--txt-dim)" } }, vacio || "Sin registros.")) : null,
        filas.map((f, i) => h("tr", { key: i, style: { background: i % 2 ? "transparent" : "var(--panel2)" } },
          f.map((c, j) => h("td", {
            key: j,
            style: {
              padding: "9px 10px", borderBottom: "1px solid var(--border)", verticalAlign: "top",
              zIndex: j < nf ? 2 : undefined,
              ...(fija(j, i % 2 ? "var(--bg2)" : "var(--panel2)") || {})
            }
          }, c)))))));
}
