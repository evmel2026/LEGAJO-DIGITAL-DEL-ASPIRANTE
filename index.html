  const traerBitacoras = useCallback(async () => {
    try {
      const [av, ac, re] = await Promise.all([DB.bitacora("avisos", 80), DB.bitacora("accesos", 300), DB.bitacora("recorrido", 500)]);
      setAvisos(av || []);
      setAccesos(ac || []);
      setRecorrido(re || []);
    } catch (e) {}
  }, []);

  const cargar = useCallback(async () => {
    setCargando(true);
    try {
      const d = await DB.getAll();
      setData({ legajos: d.legajos || [], usuarios: d.usuarios || [] });
      try {
        const ac = await DB.get(CLAVE_ACARGO);
        setACargo(ac && typeof ac === "object" ? ac : {});
      } catch (e) {}
      try {
        const priv = await DB.get(CLAVE_AVISOS_ADMIN);
        setAvisosSoloAdmin(priv === undefined || priv === null ? true : priv !== false);
      } catch (e) {}
      // Los cierres mensuales de la planilla de estadísticas
      let pl = {};
      try {
        const p = await DB.get(CLAVE_PLANILLA);
        if (p && typeof p === "object") pl = p;
      } catch (e) {}
      setPlanillas(pl);
      // Qué alertas automáticas ya se publicaron. Esto ahora está en la base:
      // si estuviera sólo en el aparato, cada máquina nueva volvería a publicar
      // las mismas y la campanita se llenaría de novedades repetidas.
      let vistas = [];
      try {
        const v = await DB.get(CLAVE_ALERTAS);
        if (Array.isArray(v)) vistas = v;
      } catch (e) {}
      const locales = lsGet("lda_alertas", []);
      if (locales.length) vistas = Array.from(new Set(vistas.concat(locales)));
      const nuevas = alertasVencimiento(d.legajos || []).concat(alertaPlanilla(pl)).filter(a => !vistas.includes(a.id));
      if (nuevas.length) {
        const lista = [...vistas, ...nuevas.map(a => a.id)].slice(-400);
        lsSet("lda_alertas", lista);
        try {
          await DB.set(CLAVE_ALERTAS, lista);
        } catch (e) {}
        for (const a of nuevas) await apilar("avisos", { usuario: "sistema", nombre: "Sistema", msg: "⏰ " + a.msg }, 80);
      }
    } catch (e) {
      toast("Error al cargar: " + e.message, "err");
    }
    await traerBitacoras();
    setCargando(false);
  }, [traerBitacoras]);

  useEffect(() => {
    if (!user) return;
    cargar();
    registrarAcceso(user).then(a => a && setAccesos(a));
    toast(`${emojiHora()} ${saludoHora()}, ${comoLlamar(user)}`, "ok");
  }, [user, cargar]);

  // Tiempo real: lo que carga otra persona aparece acá al instante
  useEffect(() => {
    if (!user || !sb) return;
    const canal = sb.channel("lda-vivo")
      .on("postgres_changes", { event: "*", schema: "public", table: TABLAS.legajos }, carga => {
        const fila = carga.new || carga.old;
        if (!fila) return;
        setData(d => {
          if (carga.eventType === "DELETE") return { ...d, legajos: d.legajos.filter(x => x.id !== fila.id) };
          const l = migrarLegajo(fila.data);
          if (!l) return d;
          const existe = d.legajos.some(x => x.id === l.id);
          return { ...d, legajos: existe ? d.legajos.map(x => x.id === l.id ? l : x) : [...d.legajos, l] };
        });
      })
      .on("postgres_changes", { event: "*", schema: "public", table: TABLAS.avisos }, () => {
        DB.bitacora("avisos", 80).then(a => a && setAvisos(a)).catch(() => {});
      })
      .on("postgres_changes", { event: "*", schema: "public", table: TABLAS.usuarios }, () => {
        DB.getAll().then(d => setData(prev => ({ ...prev, usuarios: d.usuarios }))).catch(() => {});
      })
      .subscribe();
    return () => {
      try {
        sb.removeChannel(canal);
      } catch (e) {}
    };
  }, [user]);

  // Red de seguridad: si el tiempo real se corta, refresca solo cada 45 segundos
  useEffect(() => {
    if (!user) return;
    const t = setInterval(traerBitacoras, 45000);
    return () => clearInterval(t);
  }, [user, traerBitacoras]);

  useEffect(() => {
    if (user) registrarPaso(user, "Abrió " + vista, "");
  }, [vista, user]);

  // ¿Quién escribió el aviso? Los que publica una administradora pueden quedar
  // reservados para las administradoras: lo que carga Mely o Eliana no tiene por
  // qué llegarle al resto del equipo. No hace falta tocar la tabla lda_avisos:
  // se resuelve mirando el rol del autor en lda_usuarios.
  const esAvisoDeAdmin = useCallback(a => {
    if (!a || !a.usuario || a.usuario === "sistema") return false;
    const u = (data.usuarios || []).find(x => norm(x.usuario) === norm(a.usuario));
    return !!u && u.rol === "admin";
  }, [data.usuarios]);

  const soyAdmin = esAdmin(user);

  const notifs = useMemo(() => (avisos || [])
    .map(a => ({
      id: a.id,
      msg: a.msg,
      hora: a.fecha,
      deAdmin: esAvisoDeAdmin(a),
      leida: !!ultimaLectura && a.ts <= ultimaLectura,
      archivada: !!ocultarHasta && a.ts <= ocultarHasta
    }))
    .filter(n => !(n.deAdmin && avisosSoloAdmin && !soyAdmin)),
    [avisos, ultimaLectura, ocultarHasta, esAvisoDeAdmin, avisosSoloAdmin, soyAdmin]);

  const avisosDeAdmin = useMemo(() => (avisos || []).filter(esAvisoDeAdmin), [avisos, esAvisoDeAdmin]);

  // Eliminar de verdad: se van de la base, no quedan ni en el historial de nadie
  const borrarAvisos = async ids => {
    const lista = (ids || []).filter(Boolean);
    if (!lista.length) return;
    try {
      await DB.borrarAvisos(lista);
      setAvisos(av => (av || []).filter(a => !lista.includes(a.id)));
      toast(lista.length === 1 ? "Novedad eliminada" : `${lista.length} novedades eliminadas`, "ok");
    } catch (e) {
      toast("No se pudieron eliminar: " + (e.message || e), "err");
    }
  };

  const borrarAvisosDeAdmin = () => {
    const ids = avisosDeAdmin.map(a => a.id);
    if (!ids.length) {
      toast("No hay novedades de las administradoras para eliminar", "ok");
      return;
    }
    setConfirmar({
      titulo: "Eliminar las novedades de las administradoras",
      texto: `Se borran ${ids.length} ${ids.length === 1 ? "novedad" : "novedades"} de la campanita, en todos los usuarios y para siempre. Los legajos y el historial de cada ficha no se tocan.`,
      textoOk: "Sí, eliminarlas",
      onOk: () => {
        setConfirmar(null);
        borrarAvisos(ids);
      }
    });
  };

  const cambiarAvisosSoloAdmin = async v => {
    setAvisosSoloAdmin(v);
    try {
      await DB.set(CLAVE_AVISOS_ADMIN, v);
      toast(v ? "Lo que cargan las administradoras queda sólo para ustedes" : "Las novedades de las administradoras las ve todo el equipo", "ok");
    } catch (e) {
      toast("No se pudo guardar la preferencia: " + (e.message || e), "err");
    }
  };

  // La marca de leídas se guarda en la base, por usuario, así que lo que se
  // miró en el celular ya está mirado en la computadora. Nunca va para atrás:
  // entre la marca del aparato y la de la base gana la más nueva.
  const guardarLectura = async (leidos, ocultos) => {
    if (!user) return;
    try {
      const previo = await DB.get(CLAVE_LECTURA);
      const mapa = previo && typeof previo === "object" ? { ...previo } : {};
      const k = norm(user.usuario);
      mapa[k] = {
        ...(mapa[k] || {}),
        ...(leidos ? { leidos } : {}),
        ...(ocultos ? { ocultos } : {})
      };
      await DB.set(CLAVE_LECTURA, mapa);
    } catch (e) {}
  };

  const marcarLeidas = () => {
    const t = new Date().toISOString();
    lsSet("lda_leidos", t);
    setUltimaLectura(t);
    guardarLectura(t, null);
  };
  // "Limpiar" sólo despeja la campanita: los avisos quedan guardados en el historial
  const archivarAvisos = () => {
    const t = new Date().toISOString();
    lsSet("lda_ocultos", t);
    setOcultarHasta(t);
    lsSet("lda_leidos", t);
    setUltimaLectura(t);
    guardarLectura(t, t);
  };

  // Traer de la base hasta dónde llegó este usuario: al entrar y cada vez que
  // vuelve a la ventana, que es justo cuando cambió de aparato.
  useEffect(() => {
    if (!user) return;
    let vivo = true;
    const masNuevo = (a, b) => ((a || "") > (b || "") ? (a || "") : (b || ""));
    const sincronizar = () => {
      DB.get(CLAVE_LECTURA).then(lec => {
        if (!vivo || !lec || typeof lec !== "object") return;
        const mia = lec[norm(user.usuario)] || {};
        if (mia.leidos) setUltimaLectura(v => {
          const n = masNuevo(v, mia.leidos);
          lsSet("lda_leidos", n);
          return n;
        });
        if (mia.ocultos) setOcultarHasta(v => {
          const n = masNuevo(v, mia.ocultos);
          lsSet("lda_ocultos", n);
          return n;
        });
      }).catch(() => {});
    };
    sincronizar();
    window.addEventListener("focus", sincronizar);
    return () => {
      vivo = false;
      window.removeEventListener("focus", sincronizar);
    };
  }, [user]);

  // Cierre mensual de la planilla: queda archivado tal cual se envió
  const guardarCierrePlanilla = async (clave, filas) => {
    const nuevo = { ...(planillas || {}) };
    nuevo[clave] = {
      mes: clave,
      guardado: new Date().toISOString(),
      autor: comoLlamar(user),
      total: filas.length,
      filas
    };
    // Se guardan los últimos 18 meses: alcanza de sobra y no infla la base
    const claves = Object.keys(nuevo).sort();
    while (claves.length > 18) delete nuevo[claves.shift()];
    try {
      await DB.set(CLAVE_PLANILLA, nuevo);
      setPlanillas(nuevo);
      toast(`Planilla de ${nombreMes(clave)} guardada`, "ok");
      const av = await publicarAviso(user, `${comoLlamar(user)} cerró la planilla de Estadísticas DCFyCCCO de ${nombreMes(clave)}`);
      if (av) setAvisos(av);
    } catch (e) {
      toast("No se pudo guardar la planilla: " + (e.message || e), "err");
    }
  };

  const visibles = data.legajos;
  const enBajas = vista === "bajas";

  const filtrados = useMemo(() => {
    const nq = norm(qDeb);
    return visibles.filter(l => {
      if (enBajas !== esInactivo(l)) return false;
      if (fSeccion && (l.seccion || "Sin asignar") !== fSeccion) return false;
      if (fEstado && (l.estado || "Activo") !== fEstado) return false;
      if (fListado && (l.listado || "1er listado") !== fListado) return false;
      if (fSexo && (l.sexo || "") !== fSexo) return false;
      if (fAsist && (l.asistencia || "") !== fAsist) return false;
      if (nq && !legajoTexto(l).includes(nq)) return false;
      return true;
    }).sort((a, b) => (a.apellido || "").localeCompare(b.apellido || "", "es"));
  }, [visibles, qDeb, fEstado, fListado, fSexo, fAsist, fSeccion, enBajas]);

  const delGrupo = useMemo(() => visibles.filter(l => enBajas === esInactivo(l)), [visibles, enBajas]);
  const cuentaSeccion = sec => delGrupo.filter(l => (l.seccion || "Sin asignar") === sec).length;

  const totalPaginas = Math.max(1, Math.ceil(filtrados.length / POR_PAGINA));
  const pagActual = Math.min(pagina, totalPaginas);
  const enPantalla = filtrados.slice((pagActual - 1) * POR_PAGINA, pagActual * POR_PAGINA);

  const guardarUsuarios = async nu => {
    await DB.guardarUsuarios(nu);
    setData(d => ({ ...d, usuarios: nu }));
  };

  const guardarLegajo = async l => {
    const anterior = data.legajos.find(x => x.id === l.id);
    if (!esAdmin(user)) {
      if (!puedeCargarDatos(user)) {
        toast("No tenés autorización para cargar: podés consultar y descargar todo, pero no modificar legajos.", "err");
        return;
      }
      // ¿El legajo es de una sección a su cargo? (el supervisor operacional tiene todas)
      const propio = puedeEditarLegajo(user, l) &&
        (!anterior || !anterior.seccion || puedeEditarLegajo(user, anterior));
      // Si no lo es, sólo pasan los certificados médicos y la baja
      if (!propio && !soloCambiosDeTodaSeccion(anterior, l)) {
        const mias = user.secciones || [];
        toast(mias.length
          ? `Ese legajo es de ${(anterior && anterior.seccion) || l.seccion || "otra sección"}: de las secciones que no tenés a cargo podés cargar certificados médicos y registrar la baja, el resto no.`
          : "No tenés secciones a cargo: sólo podés cargar certificados médicos y registrar bajas.", "err");
        return;
      }
    }
    const cambios = diffLegajo(anterior, l);
    const registro = {
      id: uid(),
      usuario: comoLlamar(user),
      fecha: new Date().toLocaleString("es-AR", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" }),
      accion: anterior ? "Modificación" : "Alta",
      cambios
    };
    if (!anterior || cambios.length) l = { ...l, historial: [...(l.historial || []), registro].slice(-200) };
    if (!anterior && !l.fechaAlta) l.fechaAlta = hoy();
    if ((anterior ? anterior.asistencia || "" : "") !== (l.asistencia || "")) l.asistenciaFecha = l.asistencia ? hoy() : "";
    if (anterior && !esInactivo(anterior) && esInactivo(l)) {
      l.fechaEstado = l.fechaEstado || hoy();
      const kf = CAMPO_FECHA_ESTADO[l.estado];
      if (kf && !l[kf]) l[kf] = hoy();
    }
    if (esInactivo(anterior || {}) && !esInactivo(l)) {
      l.fechaBaja = "";
      l.fechaDesistio = "";
      l.fechaDesafectado = "";
    }
    await DB.guardarLegajo(l);
    const nuevos = anterior ? data.legajos.map(x => x.id === l.id ? l : x) : [...data.legajos, l];
    setData({ ...data, legajos: nuevos });
    setSel(l);
    const quien = `${l.apellido || "aspirante"}`;
    const av = await publicarAviso(user, `${comoLlamar(user)} ${anterior ? "actualizó" : "creó"} el legajo de ${quien}${l.seccion ? " · " + l.seccion : ""}`);
    if (av) setAvisos(av);
    registrarPaso(user, anterior ? "Guardó un legajo" : "Creó un legajo", quien).then(r => r && setRecorrido(r));
    if (anterior && !esInactivo(anterior) && esInactivo(l)) toast(`Pasó a "${l.estado}": ahora está en Bajas, Desistieron y Desafectados`, "ok");
  };

  const completarDesdeListado = async () => {
    if (!esAdmin(user)) {
      toast("Sólo las administradoras pueden completar datos del listado", "err");
      return;
    }
    const porDni = {};
    ASPIRANTES_SEMILLA.forEach(a => porDni[(a.dni || "").trim()] = a);
    const campos = ["sexo", "edad", "fechaNac", "telefono", "domicilioReal", "ciudad", "provincia"];
    let tocados = 0;
    const nuevos = [];
    for (const l of data.legajos) {
      const a = porDni[(l.dni || "").trim()];
      if (!a) {
        nuevos.push(l);
        continue;
      }
      const faltan = {};
      campos.forEach(k => {
        if (!(l[k] || "").toString().trim() && a[k]) faltan[k] = a[k];
      });
      if (!Object.keys(faltan).length) {
        nuevos.push(l);
        continue;
      }
      const act = {
        ...l, ...faltan,
        historial: [...(l.historial || []), {
          id: uid(), usuario: comoLlamar(user),
          fecha: new Date().toLocaleString("es-AR", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" }),
          accion: "Completado desde el listado oficial",
          cambios: Object.keys(faltan).map(k => `${k}: "${faltan[k]}"`)
        }].slice(-200)
      };
      await DB.guardarLegajo(act);
      nuevos.push(act);
      tocados++;
    }
    setData({ ...data, legajos: nuevos });
    toast(tocados ? `${tocados} legajo${tocados === 1 ? "" : "s"} completado${tocados === 1 ? "" : "s"} desde el listado` : "No había datos pendientes de completar", "ok");
    if (tocados) {
      const av = await publicarAviso(user, `${comoLlamar(user)} completó ${tocados} legajos desde el listado oficial`);
      if (av) setAvisos(av);
    }
  };

  // Importa la planilla oficial completa (Excel): crea los legajos que faltan,
  // reparte secciones y carga la distribución de alojamiento. No toca el estado
  // de nadie, así las bajas, los desistimientos y los desafectados quedan como están.
  const importarPlanilla = async (file, listadoNuevos) => {
    if (!esAdmin(user)) {
      toast("Sólo las administradoras pueden importar la planilla", "err");
      return null;
    }
    let lectura = null;
    try {
      lectura = await leerPlanillaOficial(file);
    } catch (e) {
      toast("No pude leer el archivo. Tiene que ser un Excel (.xlsx)", "err");
      return null;
    }
    const filas = (lectura && lectura.filas) || [];
    if (!filas.length) {
      toast("No encontré filas con DNI y apellido en la planilla", "err");
      return null;
    }
    const porDni = {};
    const porNom = {};
    data.legajos.forEach((l, i) => {
      const d = soloNros(l.dni);
      if (d) porDni[d] = i;
      const n = claveNombre(`${l.apellido || ""} ${l.nombre || ""}`);
      if (n) porNom[n] = i;
    });
    const nuevos = [...data.legajos];
    const sello = () => new Date().toLocaleString("es-AR", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" });
    const res = {
      total: filas.length, creados: [], actualizados: 0, sinCambios: 0, errores: 0,
      secciones: 0, alojamiento: 0, sexos: 0,
      hojasLeidas: lectura.hojasLeidas, hojasIgnoradas: lectura.hojasIgnoradas
    };
    for (const f of filas) {
      let i = porDni[f.dni];
      if (i === undefined) {
        const n = claveNombre(f.completo);
        if (n) i = porNom[n];
      }
      // Qué le corresponde según la planilla
      const aloj = { modulo: f.modulo || "", habitacion: f.habitacion || "" };
      try {
        if (i !== undefined) {
          const l = nuevos[i];
          const cambios = [];
          const act = { ...l };
          // Datos que sólo se completan si están vacíos: nunca se pisa lo cargado a mano
          const rellenar = (k, v, etiqueta) => {
            if (!v) return;
            if ((act[k] || "").toString().trim()) return;
            act[k] = v;
            cambios.push(`${etiqueta}: "${v}"`);
          };
          rellenar("dni", f.dni, "DNI");
          rellenar("apellido", f.apellido, "Apellido");
          rellenar("nombre", f.nombre, "Nombre");
          rellenar("edad", f.edad, "Edad");
          rellenar("fechaNac", f.fechaNac, "Fecha de nacimiento");
          rellenar("telefono", f.telefono, "Teléfono");
          rellenar("domicilioReal", f.domicilioReal, "Domicilio");
          // Origen: si estaba vac\u00edo se completa, y si estaba escrito distinto pero es
          // el mismo lugar (por ejemplo "J.D.L ANDES") se unifica al nombre completo
          const unificar = (k, v, etiqueta, fn) => {
            if (!v) return;
            const actual = (act[k] || "").toString().trim();
            if (!actual) {
              act[k] = v;
              cambios.push(`${etiqueta}: "${v}"`);
              return;
            }
            if (actual !== v && fn(actual) === v) {
              act[k] = v;
              cambios.push(`${etiqueta}: "${actual}" \u2192 "${v}"`);
            }
          };
          unificar("localidad", f.localidad, "Localidad", normLocalidad);
          unificar("ciudad", f.localidad, "Ciudad", normLocalidad);
          unificar("provincia", f.provincia, "Provincia", normProvincia);
          // Datos de los que la planilla es la fuente oficial: se actualizan
          if (f.seccion && (l.seccion || "") !== f.seccion) {
            act.seccion = f.seccion;
            cambios.push(`Sección: "${l.seccion || "sin asignar"}" → "${f.seccion}"`);
            res.secciones++;
          }
          if (f.sexo && (l.sexo || "") !== f.sexo) {
            act.sexo = f.sexo;
            cambios.push(`Sexo: "${l.sexo || "—"}" → "${f.sexo}"`);
            res.sexos++;
          }
          if (f.listado && (l.listado || "") !== f.listado) {
            act.listado = f.listado;
            cambios.push(`Listado: "${l.listado || "—"}" → "${f.listado}"`);
          }
          const alojViejo = l.alojamiento || {};
          if ((aloj.modulo || aloj.habitacion) && (alojViejo.modulo || "") + "|" + (alojViejo.habitacion || "") !== aloj.modulo + "|" + aloj.habitacion) {
            act.alojamiento = { ...alojViejo, ...aloj };
            cambios.push(`Alojamiento: "${alojViejo.modulo || "sin asignar"}" → "${aloj.modulo || "sin asignar"}"`);
            res.alojamiento++;
          }
          if (f.preocupacional && norm(f.preocupacional).includes("apto") && !(l.preocupacional || {}).apto) {
            act.preocupacional = { ...(l.preocupacional || {}), realizado: true, apto: norm(f.preocupacional).includes("no apto") ? "No apto" : "Apto" };
            cambios.push("Preocupacional cargado desde la planilla");
          }
          if (!cambios.length) {
            res.sinCambios++;
            continue;
          }
          act.historial = [...(l.historial || []), {
            id: uid(), usuario: comoLlamar(user), fecha: sello(),
            accion: "Actualizado desde la planilla oficial",
            cambios
          }].slice(-200);
          await DB.guardarLegajo(act);
          nuevos[i] = act;
          res.actualizados++;
        } else {
          const base = nuevoLegajo();
          const l = {
            ...base,
            apellido: f.apellido,
            nombre: f.nombre,
            dni: f.dni,
            edad: f.edad || "",
            fechaNac: f.fechaNac || "",
            sexo: f.sexo || "",
            telefono: f.telefono || "",
            domicilioReal: f.domicilioReal || "",
            localidad: f.localidad || "",
            ciudad: f.localidad || "",
            provincia: f.provincia || "",
            seccion: f.seccion || "",
            alojamiento: { ...base.alojamiento, ...aloj },
            listado: f.listado || listadoNuevos || "2do listado",
            estado: "Activo",
            fechaAlta: hoy(),
            preocupacional: f.preocupacional && norm(f.preocupacional).includes("apto")
              ? { ...base.preocupacional, realizado: true, apto: norm(f.preocupacional).includes("no apto") ? "No apto" : "Apto" }
              : base.preocupacional,
            historial: [{
              id: uid(), usuario: comoLlamar(user), fecha: sello(),
              accion: "Legajo creado desde la planilla oficial",
              cambios: [`${f.completo} · DNI ${f.dni} · ${f.seccion || "sin sección"} · ${aloj.modulo || "sin alojamiento"}`]
            }]
          };
          await DB.guardarLegajo(l);
          nuevos.push(l);
          porDni[f.dni] = nuevos.length - 1;
          res.creados.push(l);
        }
      } catch (e) {
        res.errores++;
      }
    }
    setData({ ...data, legajos: nuevos });
    const tocados = res.actualizados + res.creados.length;
    toast(tocados
      ? `Listo: ${res.creados.length} legajo${res.creados.length === 1 ? "" : "s"} nuevo${res.creados.length === 1 ? "" : "s"} y ${res.actualizados} actualizado${res.actualizados === 1 ? "" : "s"}`
      : "La planilla no traía nada nuevo: todo estaba al día", tocados ? "ok" : "info");
    if (tocados) {
      const av = await publicarAviso(user, `${comoLlamar(user)} importó la planilla oficial: ${res.creados.length} legajos nuevos y ${res.actualizados} actualizados`);
      if (av) setAvisos(av);
      registrarPaso(user, "Importó la planilla oficial", `${res.creados.length} nuevos · ${res.actualizados} actualizados`).then(r => r && setRecorrido(r));
    }
    return res;
  };

  // Guarda qui\u00e9n est\u00e1 a cargo de cada m\u00f3dulo / gamela (va en lda_config)
  const guardarACargo = async nuevo => {
    if (!esAdmin(user)) {
      toast("S\u00f3lo las administradoras pueden cambiar el personal a cargo", "err");
      return false;
    }
    try {
      await DB.set(CLAVE_ACARGO, nuevo);
      setACargo(nuevo);
      toast("Personal a cargo actualizado", "ok");
      registrarPaso(user, "Actualiz\u00f3 el personal a cargo de gamela y m\u00f3dulos", "").then(r => r && setRecorrido(r));
      return true;
    } catch (e) {
      toast("No se pudo guardar: " + e.message, "err");
      return false;
    }
  };

  // Borra la asistencia de todos los que están en actividad para arrancar la
  // toma del día desde cero. No toca ningún otro dato del legajo.
  const limpiarAsistencia = async () => {
    if (!esAdmin(user)) {
      toast("Sólo las administradoras pueden reiniciar la asistencia", "err");
      return;
    }
    let tocados = 0;
    const nuevos = [];
    for (const l of data.legajos) {
      if (esInactivo(l) || (!l.asistencia && !l.asistenciaFecha)) {
        nuevos.push(l);
        continue;
      }
      const act = { ...l, asistencia: "", asistenciaFecha: "" };
      try {
        await DB.guardarLegajo(act);
        nuevos.push(act);
        tocados++;
      } catch (e) {
        nuevos.push(l);
      }
    }
    setData({ ...data, legajos: nuevos });
    toast(tocados ? `Asistencia en blanco en ${tocados} legajo${tocados === 1 ? "" : "s"}` : "Ya estaba toda sin cargar", "ok");
    if (tocados) {
      const av = await publicarAviso(user, `${comoLlamar(user)} reinició la asistencia del día`);
      if (av) setAvisos(av);
    }
  };

  // Arregla los legajos que quedaron con el nombre completo repetido adentro del
  // apellido: los separa en apellido y nombre y lo deja asentado en el historial
  const separarNombres = async () => {
    if (!esAdmin(user)) {
      toast("Sólo las administradoras pueden hacer este arreglo", "err");
      return;
    }
    let tocados = 0;
    const nuevos = [];
    for (const l of data.legajos) {
      if (!nombreRepetido(l)) {
        nuevos.push(l);
        continue;
      }
      const r = arreglarNombre(l);
      const act = {
        ...l, apellido: r.apellido || "", nombre: r.nombre || "",
        historial: [...(l.historial || []), {
          id: uid(), usuario: comoLlamar(user), fecha: selloFecha(),
          accion: "Apellido y nombre separados",
          cambios: [`Apellido: "${l.apellido || ""}" → "${r.apellido || ""}"`, `Nombre: "${l.nombre || ""}" → "${r.nombre || ""}"`]
        }].slice(-200)
      };
      try {
        await DB.guardarLegajo(act);
        nuevos.push(act);
        tocados++;
      } catch (e) {
        nuevos.push(l);
      }
    }
    setData({ ...data, legajos: nuevos });
    toast(tocados ? `${tocados} legajo${tocados === 1 ? "" : "s"} corregido${tocados === 1 ? "" : "s"}` : "No había nombres repetidos", "ok");
    if (tocados) {
      const av = await publicarAviso(user, `${comoLlamar(user)} separó apellido y nombre en ${tocados} legajo${tocados === 1 ? "" : "s"}`);
      if (av) setAvisos(av);
    }
  };

  // Fecha de alta de toda la convocatoria. Sin pisar, sólo completa los vacíos.
  const ponerFechaAlta = async pisarTodo => {
    if (!esAdmin(user)) {
      toast("Sólo las administradoras pueden cargar la fecha de alta en masa", "err");
      return;
    }
    let tocados = 0;
    const nuevos = [];
    for (const l of data.legajos) {
      const tiene = (l.fechaAlta || "").trim();
      if ((tiene && !pisarTodo) || tiene === FECHA_ALTA_INICIAL) {
        nuevos.push(l);
        continue;
      }
      const act = {
        ...l, fechaAlta: FECHA_ALTA_INICIAL,
        historial: [...(l.historial || []), {
          id: uid(), usuario: comoLlamar(user), fecha: selloFecha(),
          accion: "Fecha de alta cargada en masa",
          cambios: [`Fecha de alta: "${tiene || "—"}" → "${FECHA_ALTA_INICIAL}"`]
        }].slice(-200)
      };
      try {
        await DB.guardarLegajo(act);
        nuevos.push(act);
        tocados++;
      } catch (e) {
        nuevos.push(l);
      }
    }
    setData({ ...data, legajos: nuevos });
    toast(tocados ? `Fecha de alta ${fmtFecha(FECHA_ALTA_INICIAL)} en ${tocados} legajo${tocados === 1 ? "" : "s"}` : "Ya la tenían todos", "ok");
    if (tocados) {
      const av = await publicarAviso(user, `${comoLlamar(user)} cargó la fecha de alta ${fmtFecha(FECHA_ALTA_INICIAL)} en ${tocados} legajo${tocados === 1 ? "" : "s"}`);
      if (av) setAvisos(av);
    }
  };

  const pedirBorrar = l => setConfirmar({
    titulo: "Eliminar legajo",
    texto: `Vas a eliminar definitivamente el legajo de ${l.apellido || "este aspirante"}. Si la persona dejó el curso, conviene marcarla como Baja, Desistió o Desafectado: así queda en el historial.`,
    onOk: async () => {
      setConfirmar(null);
      try {
        await DB.borrarLegajo(l.id);
        setData({ ...data, legajos: data.legajos.filter(x => x.id !== l.id) });
        setSel(null);
        toast("Legajo eliminado", "ok");
        const av = await publicarAviso(user, `${comoLlamar(user)} eliminó el legajo de ${l.apellido || "un aspirante"}`);
        if (av) setAvisos(av);
      } catch (e) {
        toast("Error: " + e.message, "err");
      }
    }
  });
  const reactivar = l => setConfirmar({
    titulo: "Reincorporar aspirante",
    texto: `${l.apellido || "El aspirante"} vuelve al estado Activo y reaparece en la pestaña Legajos.`,
    textoOk: "Reincorporar",
    onOk: async () => {
      setConfirmar(null);
      await guardarLegajo({ ...l, estado: "Activo", motivoEstado: "", fechaEstado: "", fechaBaja: "", fechaDesistio: "", fechaDesafectado: "" });
      setSel(null);
      toast("Aspirante reincorporado", "ok");
    }
  });

  if (!user) return h(Login, { onLogin: setUser });

  const tarjeta = l => h("div", {
    key: l.id,
    className: "card",
    style: { padding: 16, cursor: "pointer", display: "flex", gap: 14, alignItems: "center" },
    onClick: () => setSel(l),
    onMouseEnter: e => e.currentTarget.style.borderColor = "var(--acc)",
    onMouseLeave: e => e.currentTarget.style.borderColor = "var(--border)"
  }, h("div", { style: { width: 54, height: 54, borderRadius: 10, overflow: "hidden", flexShrink: 0, background: "var(--bg2)" } },
    l.fotoPath ? h("img", { src: DB.urlPublica(l.fotoPath), style: { width: "100%", height: "100%", objectFit: "cover" } })
      : h(I.user, { style: { width: 24, height: 24, color: "var(--txt-dim)", margin: "15px auto", display: "block" } })),
    h("div", { style: { flex: 1, minWidth: 0 } },
      h("div", { style: { fontWeight: 700, fontSize: 15, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" } },
        nombreFormal(l)),
      h("div", { style: { fontSize: 12, color: "var(--txt-dim)" } },
        "DNI " + (l.dni || "—") + " · " + (l.ciudad || "Sin ciudad") + (l.provincia ? ", " + l.provincia : "")),
      enBajas && l.motivoEstado ? h("div", { style: { fontSize: 12, color: "var(--coral)", marginTop: 3 } }, "Motivo: " + l.motivoEstado) : null,
      h("div", { style: { display: "flex", gap: 5, marginTop: 6, flexWrap: "wrap", alignItems: "center" } },
        h("span", { className: "tag", style: { background: colorEstado(l.estado).bg, color: colorEstado(l.estado).fg, fontSize: 11 } }, l.estado || "Activo"),
        l.seccion ? h("span", { className: "tag", style: { background: "var(--panel2)", color: "var(--acc2)", fontSize: 11 } }, l.seccion) : null,
        l.sexo ? h("span", { className: "tag", style: { background: "var(--bg2)", color: "var(--txt-dim)", fontSize: 11 } }, l.sexo === "Femenino" ? "F" : "M") : null,
        l.asistencia ? h("span", {
          className: "tag",
          style: { background: l.asistencia === "Presente" ? "rgba(55,214,122,.15)" : "rgba(255,90,82,.15)", color: l.asistencia === "Presente" ? "var(--green)" : "var(--red)", fontSize: 11 }
        }, l.asistencia) : null,
        (l.certMedico || {}).tiene === "Sí" ? h("span", { className: "tag", style: { background: "rgba(255,176,32,.15)", color: "var(--amber)", fontSize: 11 } }, "Cert. médico") : null,
        (l.sanciones || []).length > 0 ? h("span", { className: "tag", style: { background: "rgba(255,90,82,.15)", color: "var(--red)", fontSize: 11 } }, l.sanciones.length + " S") : null,
        (l.recargos || []).length > 0 ? h("span", { className: "tag", style: { background: "rgba(255,176,32,.15)", color: "var(--amber)", fontSize: 11 } }, l.recargos.length + " R") : null)),
    h("div", { style: { display: "flex", flexDirection: "column", gap: 6, flexShrink: 0 } },
      h("button", {
        className: "btn btn-ghost",
        style: { padding: "5px 8px" },
        title: puedeEditarLegajo(user, l) ? "Editar legajo" : "Ver legajo (sólo lectura)",
        onClick: e => {
          e.stopPropagation();
          setSel(l);
        }
      }, h(puedeEditarLegajo(user, l) ? I.edit : I.doc, { style: { width: 14, height: 14 } })),
      enBajas ? h("button", {
        className: "btn btn-ghost",
        style: { padding: "5px 8px", fontSize: 11 },
        onClick: e => {
          e.stopPropagation();
          reactivar(l);
        }
      }, "Reincorporar") : null,
      user.rol === "admin" ? h("button", {
        className: "btn btn-red",
        style: { padding: "5px 8px" },
        title: "Eliminar legajo",
        onClick: e => {
          e.stopPropagation();
          pedirBorrar(l);
        }
      }, h(I.trash, { style: { width: 14, height: 14 } })) : null));

  const listado = h("div", { className: "fade", style: { maxWidth: 1100, margin: "0 auto", padding: "0 16px 60px" } },
    h("div", { style: { margin: "20px 0 6px" } },
      h("h2", { style: { fontSize: 22, color: "var(--acc2)" } }, enBajas ? "Bajas, Desistieron y Desafectados" : "Legajos activos"),
      h("div", { style: { fontSize: 13, color: "var(--txt-dim)" } },
        enBajas ? "Aspirantes que causaron baja, desistieron o fueron desafectados. Conservan todo su historial y se pueden reincorporar."
          : "Al asignar la sección en el legajo, el aspirante aparece solo en la pestaña de su sección.")),
    h("div", { style: { display: "flex", gap: 7, flexWrap: "wrap", margin: "14px 0 4px" } },
      h("button", { className: "pill-sec" + (fSeccion === "" ? " on" : ""), onClick: () => setFSeccion("") }, "Todas ", h("b", null, delGrupo.length)),
      SECCIONES.map(sec => h("button", {
        key: sec,
        className: "pill-sec" + (fSeccion === sec ? " on" : ""),
        onClick: () => setFSeccion(sec)
      }, sec, " ", h("b", null, cuentaSeccion(sec))))),
    fSeccion ? h("div", { style: { fontSize: 12.5, color: "var(--txt-dim)", marginTop: 8 } },
      h("b", { style: { color: "var(--acc2)" } }, fSeccion), " · ",
      nombresACargo(data.usuarios, fSeccion) ? h("span", null, "a cargo de ", h("b", { style: { color: "var(--txt)" } }, nombresACargo(data.usuarios, fSeccion)))
        : h("span", null, "todavía sin instructor a cargo")) : null,
    h("div", { style: { display: "flex", gap: 12, alignItems: "center", margin: "14px 0", flexWrap: "wrap" } },
      h("div", { style: { position: "relative", flex: "1 1 240px", minWidth: 0 } },
        h(I.search, { style: { width: 18, height: 18, position: "absolute", left: 12, top: 11, color: "var(--txt-dim)" } }),
        h("input", {
          className: "inp", style: { paddingLeft: 38 },
          placeholder: "Buscar por nombre, DNI, sección, oficio, estudio… cualquier dato",
          value: q, onChange: e => setQ(e.target.value)
        })),
      enBajas ? h("select", { className: "inp", style: { width: "auto", minWidth: 120 }, value: fEstado, onChange: e => setFEstado(e.target.value) },
        h("option", { value: "" }, "Bajas, desistieron y desafectados"), ESTADOS_INACTIVOS.map(e => h("option", { key: e, value: e }, e))) : null,
      h("select", { className: "inp", style: { width: "auto", minWidth: 120 }, value: fListado, onChange: e => setFListado(e.target.value) },
        h("option", { value: "" }, "Todos los listados"), LISTADOS.map(e => h("option", { key: e, value: e }, e))),
      h("select", { className: "inp", style: { width: "auto", minWidth: 110 }, value: fSexo, onChange: e => setFSexo(e.target.value) },
        h("option", { value: "" }, "Ambos sexos"), SEXOS.map(e => h("option", { key: e, value: e }, e))),
      !enBajas ? h("select", { className: "inp", style: { width: "auto", minWidth: 110 }, value: fAsist, onChange: e => setFAsist(e.target.value) },
        h("option", { value: "" }, "Toda la asistencia"), ASISTENCIA.map(e => h("option", { key: e, value: e }, e))) : null,
      h("button", { className: "btn btn-ghost", onClick: () => exportarExcel(filtrados) }, h(I.excel, { style: { width: 16, height: 16 } }), "Excel"),
      h("button", {
        className: "btn btn-coral",
        onClick: () => exportarPDFLegajos(filtrados, enBajas ? "Bajas, Desistieron y Desafectados" : (fSeccion || "Legajos activos"), "LegajoDigital_Legajos")
      }, h(I.pdf, { style: { width: 16, height: 16 } }), "PDF"),
      !enBajas && puedeCargarDatos(user) && (esAdmin(user) || esSupervisor(user) || (user.secciones || []).length) ? h("button", {
        className: "btn btn-lima",
        onClick: () => {
          const mias = user.secciones || [];
          const sec = SECCIONES.includes(fSeccion) && (esAdmin(user) || mias.includes(fSeccion)) ? fSeccion : esAdmin(user) ? "" : mias[0] || "";
          setSel({ ...nuevoLegajo(), fechaAlta: hoy(), seccion: sec });
        }
      }, h(I.plus, { style: { width: 16, height: 16 } }), "Agregar legajo") : null),
    h("div", { style: { fontSize: 13, color: "var(--txt-dim)", marginBottom: 12 } },
      `${filtrados.length} legajo${filtrados.length !== 1 ? "s" : ""}`,
      fSeccion ? ` · ${fSeccion}` : "",
      qDeb ? ` · filtrando "${qDeb}"` : "",
      totalPaginas > 1 ? ` · página ${pagActual} de ${totalPaginas}` : ""),
    cargando ? h(Cargando, null) : h("div", {
      style: { display: "grid", gridTemplateColumns: "repeat(auto-fill,minmax(min(300px,100%),1fr))", gap: 14 }
    }, enPantalla.map(tarjeta),
      filtrados.length === 0 ? h("div", { style: { gridColumn: "1/-1", textAlign: "center", padding: 50, color: "var(--txt-dim)" } },
        enBajas ? "No hay bajas, desistimientos ni desafectados en este filtro." : "No hay legajos que coincidan.") : null),
    totalPaginas > 1 ? h("div", { style: { display: "flex", gap: 8, justifyContent: "center", alignItems: "center", marginTop: 24, flexWrap: "wrap" } },
      h("button", { className: "btn btn-ghost", disabled: pagActual === 1, onClick: () => setPagina(pagActual - 1) }, "Anterior"),
      h("span", { style: { fontSize: 13, color: "var(--txt-dim)" } }, `${pagActual} / ${totalPaginas}`),
      h("button", { className: "btn btn-ghost", disabled: pagActual === totalPaginas, onClick: () => setPagina(pagActual + 1) }, "Siguiente")) : null);

  return h(Shell, {
    user,
    onLogout: async () => {
      await cerrarSesion();
      setUser(null);
    },
    toast: toastMsg,
    vista,
    setVista: v => {
      setSel(null);
      setFEstado("");
      setFSeccion("");
      setVista(v);
    },
    rol: user.rol,
    notifs,
    tema,
    onTema: cambiarTema,
    paletaPref,
    onPaleta: cambiarPaleta,
    onLimpiarNotifs: archivarAvisos,
    onLeerNotifs: marcarLeidas,
    onBorrarAviso: id => borrarAvisos([id]),
    onBorrarAvisosDeAdmin: borrarAvisosDeAdmin,
    avisosSoloAdmin,
    onAvisosSoloAdmin: cambiarAvisosSoloAdmin,
    cantAvisosAdmin: avisosDeAdmin.length,
    avisar: toast,
    usuarios: data.usuarios,
    guardarUsuarios,
    legajos: data.legajos,
    accesos,
    recorrido,
    refrescar: () => setRefresco(r => r + 1)
  }, confirmar ? h(Confirmar, {
    titulo: confirmar.titulo, texto: confirmar.texto, textoOk: confirmar.textoOk,
    onOk: confirmar.onOk, onCancel: () => setConfirmar(null)
  }) : null, sel ? h(React.Fragment, null,
    !puedeEditarLegajo(user, sel) ? h("div", { style: { maxWidth: 1000, margin: "16px auto 0", padding: "0 16px" } },
      h("div", {
        className: "card",
        style: { padding: "11px 15px", borderLeft: "4px solid var(--amber)", fontSize: 13, color: "var(--txt-dim)", display: "flex", gap: 10, alignItems: "center" }
      }, h("span", { style: { fontSize: 17 } }, "👁️"),
        h("span", null,
          user.puedeCargar === false ? "Sólo lectura. Tu usuario está sin autorización para cargar: podés ver todas las pestañas y descargar lo que necesites, pero no modificar legajos."
            : sel.seccion ? `${sel.seccion} no está a tu cargo: podés cargar los certificados médicos y registrar la baja, desistimiento o desafectación, y el resto del legajo lo ves pero no lo modificás.`
            : "Este legajo todavía no tiene sección asignada; una administradora tiene que asignarla. Igual podés cargarle certificados médicos y registrar la baja."))) : null,
    h(Detalle, {
      legajo: sel, rol: user.rol, puede: puedeEditarLegajo(user, sel), toast,
      puedeCert: puedeCargarCertificados(user, sel),
      puedeBaja: puedeRegistrarBaja(user, sel),
      autor: comoLlamar(user),
      onBack: () => setSel(null),
      onSave: guardarLegajo
    })) : vista === "inicio" ? h(Inicio, {
    legajos: visibles, onAbrir: l => setSel(l), user,
    onIrA: v => { setSel(null); setVista(v); },
    onLimpiarAsistencia: esAdmin(user) ? limpiarAsistencia : null
  }) : vista === "usuarios" && user.rol === "admin" ? h(UsuariosTab, {
    data, setData, toast
  }) : vista === "admin" && user.rol === "admin" ? h(Administracion, {
    legajos: data.legajos, usuarios: data.usuarios, accesos, recorrido, avisos,
    onAbrir: l => setSel(l), onCompletar: completarDesdeListado, avisar: toast,
    onImportarPlanilla: importarPlanilla,
    acargo, onGuardarACargo: guardarACargo, puedeEditarACargo: esAdmin(user),
    onGuardarUsuarios: guardarUsuarios,
    onSepararNombres: separarNombres, onFechaAlta: ponerFechaAlta
  }) : vista === "madre" ? h(ListadoMadre, {
    legajos: visibles, onAbrir: l => setSel(l)
  }) : VISTAS_LISTADO[vista] ? h(Listados, {
    vista, legajos: visibles, onAbrir: l => setSel(l)
  }) : vista === "planilla" ? h(PlanillaDCF, {
    legajos: data.legajos, user, guardados: planillas,
    onGuardarMes: guardarCierrePlanilla, onAbrir: l => setSel(l)
  }) : vista === "alojamiento" ? h(AlojamientoVista, {
    legajos: visibles, onAbrir: l => setSel(l), usuarios: data.usuarios, acargo,
    user, onGuardar: guardarLegajo
  }) : vista === "estadisticas" ? h(Estadisticas, {
    legajos: visibles, usuarios: data.usuarios, toast,
    onCompletar: esAdmin(user) && ASPIRANTES_SEMILLA.length ? completarDesdeListado : null
  }) : listado);
}
